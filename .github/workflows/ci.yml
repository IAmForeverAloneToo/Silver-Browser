name: CI

# Every action is pinned to a commit hash (the version follows in a
# comment); the pins are moved by hand. The workflow token can only read.

on:
  push:
    branches: [main]
  pull_request:
  # Every night at 04:17 UTC (M33.6): the fuzz targets get a long run
  # against the corpus they have grown, which a minute a push never
  # reaches.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: How long each fuzz target runs, in seconds
        required: false
        default: "60"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      # The fuzz targets are their own crate rather than a workspace
      # member, so `--all` above does not reach them.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The one-process build (M34.6): the shell without its renderers.
      - run: cargo clippy -p silver-browser --all-targets --features single-process --locked -- -D warnings
      # T3.4: only `net` opens network connections and speaks TLS
      # (docs/design/net.md, "The layering contract").
      - name: network code only in net
        run: |
          if grep -rnwE 'TcpStream|UdpSocket|ToSocketAddrs|rustls' \
              --include='*.rs' --include='Cargo.toml' crates fuzz \
              | grep -v '^crates/net/'; then
            echo "::error::network code outside crates/net"
            exit 1
          fi
      # T3.2 (M33.5): `unsafe` only in the shell's platform module, which
      # the shell's own test also holds each block of to its argument,
      # and in the one reviewed reading of the bindings' bytecode
      # (M35.12, crates/js/src/quickjs/bytecode.rs) and question of a
      # thread's stack's bounds (G253, crates/js/src/stack.rs), and the
      # scripts' sampler, a tool built with the js-sampler feature alone
      # (crates/js/src/quickjs/sampler.rs), and a WebAssembly memory's
      # buffer read in place (crates/js/src/quickjs/wasm.rs, one block),
      # and a realm's context's base64 intrinsic (quickjs/context.rs),
      # and Web Crypto's calls into aws-lc's C library (G255,
      # crates/crypto/src/native.rs).
      # Strings and line comments are cut first; M29's module, a crate
      # of its own built to WebAssembly, marks its exports `no_mangle`.
      - name: unsafe only in the platform module
        run: |
          if grep -rn --include='*.rs' unsafe crates fuzz/fuzz_targets \
              | grep -v -e '^crates/shell/src/platform.rs:' -e '^crates/js/src/quickjs/bytecode.rs:' \
                  -e '^crates/js/src/stack.rs:' -e '^crates/js/src/quickjs/sampler.rs:'                   -e '^crates/js/src/quickjs/wasm.rs:' -e '^crates/js/src/quickjs/context.rs:' \
                  -e '^crates/media/src/av1.rs:' -e '^crates/engine/tests/wasm/' \
                  -e '^crates/crypto/src/native.rs:' \
              | sed -E 's/"([^"\\]|\\.)*"//g; s#//.*##' \
              | grep -E '(^|[^[:alnum:]_-])unsafe[[:space:]]*(\{|fn|impl|trait|extern)|#\[unsafe\('; then
            echo "::error::unsafe outside crates/shell/src/platform.rs"
            exit 1
          fi

  audit:
    name: advisories + licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
      # cargo audit itself, rather than the action around it: the action
      # posts its findings as a check run, which needs a token that can
      # write checks, and fails the job when it cannot; the command's own
      # exit code says what matters (a vulnerability fails, an unmaintained
      # crate warns), and installing a built binary is faster than
      # compiling one.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file Cargo.lock
      # The fuzz targets have their own lockfile and their own tree; it is
      # not in a release, but a vulnerability there is still worth knowing
      # about.
      - run: cargo audit --file fuzz/Cargo.lock

  # No secret in any commit (2026-11-18): gitleaks, MIT, a pinned
  # release whose checksum is checked here (the release's own list,
  # verified when it was pinned), over every commit the clone has, on
  # every push. Its findings are printed redacted. The licensed action
  # is not used. The pin is moved by hand, with its checksum. It reads
  # /.gitleaks.toml: the default rules, and Wycheproof's vector files
  # allowed by path, each held to its manifest by the crypto crate's
  # every_file_here_is_upstreams test (G255).
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 over the whole history
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --no-banner

  sweep-driver:
    # The site sweep's driver (tools/sweep/sweep.mjs): its own parts, the
    # PNG reader, the likeness, the console's grouping and the causes'
    # ranking, with no browser and no network. The capture it drives is
    # the shell's, which the test job holds to its fixture pages.
    name: sweep driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node --version
      - run: node --test tools/sweep/sweep.test.mjs

  test:
    # The tests shape, measure and draw the font the text crate bundles
    # for them, so no runner needs a system font and every runner
    # measures the same.
    name: test (${{ matrix.os }})
    # Off the web (2026-11-19): a test that reaches a host no rule of its
    # puts on this machine is refused at once, and the refusal names it
    # (net's transport, SILVER_TEST_OFFLINE). Two shell tests had fetched
    # the real web unseen, and timed out on the runners.
    env:
      SILVER_TEST_OFFLINE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Mesa's software Vulkan driver, so that the GPU backend's tests
      # and its equivalence suite against the software backend (M19.3)
      # run here; where no adapter exists they say so and pass.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo build --workspace --all-targets --locked
      # Windows's runners have no GPU but a software rasterizer, on which
      # a wgpu device crashes the tests' process (2026-10-15): there the
      # GPU backend is held to Vulkan, which they lack, and its tests say
      # so and pass. Linux's job runs them on Mesa's software Vulkan.
      - if: runner.os == 'Windows'
        run: echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
        shell: bash
      # macOS's runner takes the web-platform tests about 2.5 times as
      # long as the reference machine (1,090 s against 430 s): a test
      # whose page plays media or renders sound, in real time, is given
      # three times its wait there, as wptrunner's --timeout-multiplier
      # gives a slow runner (crates/engine/tests/wpt.rs; CI 44740188267,
      # preserves-pitch.html).
      - if: runner.os == 'macOS'
        run: echo "SILVER_WPT_TIMEOUT_MULTIPLIER=3" >> "$GITHUB_ENV"
        shell: bash
      # Every test binary runs, and the step after too, whatever fails:
      # one run says all that does.
      - run: cargo test --workspace --locked --no-fail-fast
      # A test binary a signal ends names no test (2026-11-20: the render
      # crate's, SIGSEGV, on Linux, whose wgpu tests run on Mesa's software
      # Vulkan): when the step above failed, the render crate's tests run
      # again one at a time with backtraces, each named as it starts, so
      # that a crash says which test, and whether it needs the others
      # running beside it.
      - if: ${{ failure() }}
        run: cargo test -p render --locked --no-fail-fast -- --test-threads=1
        env:
          RUST_BACKTRACE: 1
      # And the shell's tests once more as one process (M34.6).
      - if: ${{ !cancelled() }}
        run: cargo test -p silver-browser --features single-process --locked --no-fail-fast
      # The render crash lives on here (2026-11-23, CI 45236775964): the
      # GPU tests take turns on Linux (crates/render/src/gpu.rs), and this
      # step runs them side by side as before, under gdb, up to ten times,
      # keeping every thread's backtrace of a crash as an artifact. It
      # never turns the run red.
      - if: runner.os == 'Linux' && !cancelled()
        name: render crash watch (side by side, under gdb)
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          SILVER_RENDER_GPU_PARALLEL: "1"
          RUST_BACKTRACE: "1"
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          bin=$(cargo test -p render --lib --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null and .target.name == "render") | .executable' \
            | head -n 1)
          mkdir -p render-crash
          for i in $(seq 1 10); do
            out="render-crash/run-$i.txt"
            gdb -q -batch -ex 'handle SIGPIPE nostop noprint' -ex run \
              -ex 'thread apply all bt' --args "$bin" > "$out" 2>&1 || true
            if grep -q 'received signal' "$out"; then
              echo "render's tests crashed on run $i; backtrace in the render-crash artifact"
              break
            fi
            rm "$out"
          done
      - if: runner.os == 'Linux' && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-crash
          path: render-crash
          if-no-files-found: ignore

  windowed:
    # The browser left alone in a real window uses next to no CPU
    # (crates/shell/tests/idle_cpu.rs). The Windows runner shows the
    # window (tried 2026-11-13: the static page 0%, the clock under 1%
    # of a core in each process).
    name: windowed (windows)
    runs-on: windows-latest
    env:
      SILVER_WINDOWED_TESTS: "1"
      SILVER_TEST_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p silver-browser --test idle_cpu --locked -- --nocapture

  benches:
    # T4.2 (M35.1): every benchmark is built and run once, in its quick
    # mode, so that one that no longer builds or panics fails the push.
    # Its numbers say nothing on a shared runner; they are taken on the
    # maintainer's machine, by turns (T4.3, docs/perf-budgets.md).
    name: benches (quick)
    runs-on: ubuntu-latest
    env:
      SILVER_BENCH_QUICK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo bench --workspace --locked --benches

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # A backstop: a target whose inputs grew slow runs on until libFuzzer
    # next looks at its clock, between inputs, which held a push run open
    # for hours (2026-11-18, 30 times slower). Push runs' fuzz jobs took 6
    # to 43 minutes and the nightly's 34 to 56; past these, the job is
    # red, not stuck.
    timeout-minutes: ${{ github.event_name == 'schedule' && 100 || 75 }}
    # A minute from an empty corpus explores very little, so each target's
    # corpus is carried between runs in the actions cache and every run
    # starts from what the last one found, and from the seeds committed
    # under fuzz/seeds (M33.6). The nightly run gets half an hour a
    # target on top of that; a cache entry no run has restored for
    # a week is evicted, and the corpus then starts from nothing again,
    # which costs coverage but never correctness.
    # The repository pins the stable toolchain in rust-toolchain.toml, which
    # would override the nightly installed below for cargo-fuzz's own build
    # and make its -Z sanitizer flags fail. RUSTUP_TOOLCHAIN wins over the
    # file, so every cargo/rustc call in this job uses nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
      # The prebuilt cargo-fuzz is a static musl binary and takes its own
      # build triple as the default target; musl has no std installed here
      # and cannot use the address sanitizer, so the target is named.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    strategy:
      fail-fast: false
      # The nightly's half hour a target, all at once, held every runner
      # the account has for over two hours, and a push run queued behind
      # it for three (2026-11-22, run 45027224085): the nightly takes
      # eight runners at a time, leaving the rest to pushes, which take
      # as many as they like.
      max-parallel: ${{ github.event_name == 'schedule' && 8 || 64 }}
      matrix:
        target: [html_parse, css_stylesheet, selector_parse, style_document, pipeline, mutation, encoding_decode, url_parse, mime_sniff, http_response, media_query, values, animations, image_decode, script, dom_api, input, csp, referrer, hsts, frames, cookies, storage, http_cache, wasm, canvas, clone, xml_parse, svg, ipc_decode, devtools_json, idb_keys, idb_ops, content_disposition, hpack, h2_client, preload_scan, cache_api, sw_registry, media_demux, av1_decode, audio_graph, gpu_wire, webgpu_ops, glsl_parse, webgl_ops, websocket, event_stream, crypto_import, crypto_gcm, crypto_rsa_roundtrip]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      # The inputs earlier runs found. The key carries the run number so
      # every run saves a new entry, and the prefix restores the newest
      # matching one; libfuzzer minimises the directory as it goes, so it
      # does not grow without bound.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # webgpu_ops and webgl_ops drive a GPU service: the engine's gpu
      # feature, and Mesa's software Vulkan (lavapipe) for its adapter.
      - if: matrix.target == 'webgpu_ops' || matrix.target == 'webgl_ops'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.fuzz_seconds || (github.event_name == 'schedule' && 1800 || 60) }}
          # Leaks inside lavapipe, which LeakSanitizer cannot follow, are
          # not ours (fuzz/lsan-suppressions.txt says which and why).
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/fuzz/lsan-suppressions.txt
        # An input is a failure past 30 s (-timeout): the slowest a green
        # run's targets took under the address sanitizer was 12 s.
        # A page nested to the parser's cap needs about 17 MiB of stack
        # under the address sanitizer (engine::STACK_SIZE): more than the
        # main thread's 8 MiB. Its output kept (bash's pipefail fails the
        # step with it) for the throughput check below.
        shell: bash
        run: |
          ulimit -s 65536
          mkdir -p fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" ${{ (matrix.target == 'webgpu_ops' || matrix.target == 'webgl_ops') && '--features gpu' || '' }} ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time="$SECONDS_PER_TARGET" -max_len=4096 -rss_limit_mb=2048 -timeout=30 \
            2>&1 | tee fuzz-run.log
      # A push run's rate (libFuzzer's last line, "Done N runs in T
      # second(s)") under the target's floor (fuzz/throughput-floors.txt, a
      # tenth of its slowest over three green push runs) fails the job,
      # which says the rate measured and the floor wanted. The nightly's
      # longer runs have rates of their own, and no floor.
      - name: Throughput
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: bash fuzz/throughput.sh ${{ matrix.target }} fuzz-run.log fuzz/throughput-floors.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: fuzz/artifacts
