name: CI

# Every action is pinned to a commit hash (the version follows in a
# comment); the pins are moved by hand. The workflow token can only read.

on:
  push:
    branches: [main]
  pull_request:
  # Every night at 04:17 UTC (M33.6): the fuzz targets get a long run
  # against the corpus they have grown, which a minute a push never
  # reaches.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: How long each fuzz target runs, in seconds
        required: false
        default: "60"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      # The fuzz targets are their own crate rather than a workspace
      # member, so `--all` above does not reach them.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The one-process build (M34.6): the shell without its renderers.
      - run: cargo clippy -p silver-browser --all-targets --features single-process --locked -- -D warnings
      # T3.4: only `net` opens network connections and speaks TLS
      # (docs/design/net.md, "The layering contract").
      - name: network code only in net
        run: |
          if grep -rnwE 'TcpStream|UdpSocket|ToSocketAddrs|rustls' \
              --include='*.rs' --include='Cargo.toml' crates fuzz \
              | grep -v '^crates/net/'; then
            echo "::error::network code outside crates/net"
            exit 1
          fi
      # T3.2 (M33.5): `unsafe` only in the shell's platform module, which
      # the shell's own test also holds each block of to its argument,
      # and in the one reviewed reading of the bindings' bytecode
      # (M35.12, crates/js/src/quickjs/bytecode.rs).
      # Strings and line comments are cut first; M29's module, a crate
      # of its own built to WebAssembly, marks its exports `no_mangle`.
      - name: unsafe only in the platform module
        run: |
          if grep -rn --include='*.rs' unsafe crates fuzz/fuzz_targets \
              | grep -v -e '^crates/shell/src/platform.rs:' -e '^crates/js/src/quickjs/bytecode.rs:' \
                  -e '^crates/engine/tests/wasm/' \
              | sed -E 's/"([^"\\]|\\.)*"//g; s#//.*##' \
              | grep -E '(^|[^[:alnum:]_-])unsafe[[:space:]]*(\{|fn|impl|trait|extern)|#\[unsafe\('; then
            echo "::error::unsafe outside crates/shell/src/platform.rs"
            exit 1
          fi

  audit:
    name: advisories + licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
      # cargo audit itself, rather than the action around it: the action
      # posts its findings as a check run, which needs a token that can
      # write checks, and fails the job when it cannot; the command's own
      # exit code says what matters (a vulnerability fails, an unmaintained
      # crate warns), and installing a built binary is faster than
      # compiling one.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file Cargo.lock
      # The fuzz targets have their own lockfile and their own tree; it is
      # not in a release, but a vulnerability there is still worth knowing
      # about.
      - run: cargo audit --file fuzz/Cargo.lock

  test:
    # The tests shape, measure and draw the font the text crate bundles
    # for them, so no runner needs a system font and every runner
    # measures the same.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Mesa's software Vulkan driver, so that the GPU backend's tests
      # and its equivalence suite against the software backend (M19.3)
      # run here; where no adapter exists they say so and pass.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo build --workspace --all-targets --locked
      # Windows's runners have no GPU but a software rasterizer, on which
      # a wgpu device crashes the tests' process (2026-10-15): there the
      # GPU backend is held to Vulkan, which they lack, and its tests say
      # so and pass. Linux's job runs them on Mesa's software Vulkan.
      - if: runner.os == 'Windows'
        run: echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
        shell: bash
      # Every test binary runs, and the step after too, whatever fails:
      # one run says all that does.
      - run: cargo test --workspace --locked --no-fail-fast
      # And the shell's tests once more as one process (M34.6).
      - if: ${{ !cancelled() }}
        run: cargo test -p silver-browser --features single-process --locked --no-fail-fast

  benches:
    # T4.2 (M35.1): every benchmark is built and run once, in its quick
    # mode, so that one that no longer builds or panics fails the push.
    # Its numbers say nothing on a shared runner; they are taken on the
    # maintainer's machine, by turns (T4.3, docs/perf-budgets.md).
    name: benches (quick)
    runs-on: ubuntu-latest
    env:
      SILVER_BENCH_QUICK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo bench --workspace --locked --benches

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # A minute from an empty corpus explores very little, so each target's
    # corpus is carried between runs in the actions cache and every run
    # starts from what the last one found, and from the seeds committed
    # under fuzz/seeds (M33.6). The nightly run gets half an hour a
    # target on top of that; a cache entry no run has restored for
    # a week is evicted, and the corpus then starts from nothing again,
    # which costs coverage but never correctness.
    # The repository pins the stable toolchain in rust-toolchain.toml, which
    # would override the nightly installed below for cargo-fuzz's own build
    # and make its -Z sanitizer flags fail. RUSTUP_TOOLCHAIN wins over the
    # file, so every cargo/rustc call in this job uses nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
      # The prebuilt cargo-fuzz is a static musl binary and takes its own
      # build triple as the default target; musl has no std installed here
      # and cannot use the address sanitizer, so the target is named.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        target: [html_parse, css_stylesheet, selector_parse, style_document, pipeline, mutation, encoding_decode, url_parse, mime_sniff, http_response, media_query, values, animations, image_decode, script, dom_api, input, csp, referrer, hsts, frames, cookies, storage, http_cache, wasm, canvas, clone, xml_parse, svg, ipc_decode, devtools_json, idb_keys, idb_ops, content_disposition, hpack, h2_client, preload_scan, cache_api]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      # The inputs earlier runs found. The key carries the run number so
      # every run saves a new entry, and the prefix restores the newest
      # matching one; libfuzzer minimises the directory as it goes, so it
      # does not grow without bound.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.fuzz_seconds || (github.event_name == 'schedule' && 1800 || 60) }}
        # A page nested to the parser's cap needs about 17 MiB of stack
        # under the address sanitizer (engine::STACK_SIZE): more than the
        # main thread's 8 MiB.
        run: |
          ulimit -s 65536
          mkdir -p fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time="$SECONDS_PER_TARGET" -max_len=4096 -rss_limit_mb=2048
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: fuzz/artifacts
