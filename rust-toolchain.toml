# The compiler every build uses, pinned to an exact version rather than
# "stable". A release is meant to be rebuildable byte for byte from its
# source, and the bytes depend on the compiler: with a floating channel a
# rebuild a month later uses a different rustc and produces different
# binaries. Pinned here, the tagged source says which compiler built it.
#
# Moved by hand, in its own commit, so the change is visible.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
