[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz targets need nightly and libfuzzer; they build on their own.
# The vendored crates are dependencies, not members (vendor/README.md).
exclude = ["fuzz", "vendor"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"

# Layer order (dependencies may only point DOWN this list):
#   shell -> { engine, ui }
#   engine -> { render, paint, layout, style, text, net, html, css } -> { dom, encoding }
#   ui -> { render, paint, text }
#   layout, paint, render -> images (a leaf: decoders, M23)
#   engine -> js (a leaf: scripts, M24)
#   engine -> profile (a leaf: the profile on disk, M28)
#   engine -> canvas -> { style, text, images, css } (the 2D canvas, M30)
#   engine, layout -> svg -> { canvas, style, text, dom } (SVG, M32)
#   engine, shell -> devtools (a leaf: the DevTools' protocol, M36)
#   engine -> media (a leaf: containers and decoders, M40)
#   engine -> audio (a leaf: Web Audio's rendering, M40)
# See docs/architecture.md — the layering contract is binding.
[workspace.dependencies]
# Internal crates
dom = { path = "crates/dom" }
encoding = { path = "crates/encoding" }
html = { path = "crates/html" }
css = { path = "crates/css" }
style = { path = "crates/style" }
layout = { path = "crates/layout" }
text = { path = "crates/text" }
net = { path = "crates/net" }
paint = { path = "crates/paint" }
images = { path = "crates/images" }
canvas = { path = "crates/canvas" }
svg = { path = "crates/svg" }
# Without their default features: the GPU backend (M19.3) is a feature
# of each, `gpu`, which the shell's own turns on down the line.
render = { path = "crates/render", default-features = false }
engine = { path = "crates/engine", default-features = false }
ui = { path = "crates/ui" }
js = { path = "crates/js" }
profile = { path = "crates/profile" }
devtools = { path = "crates/devtools" }
media = { path = "crates/media" }
audio = { path = "crates/audio" }

# External crates
winit = "0.30"
softbuffer = "0.4"
# Without its PNG support, which nothing calls: `images` decodes PNG.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# The image decoders (M23.1, docs/design/images.md): pure Rust; zune-jpeg
# without its SIMD code, which is its only unsafe code.
png = "0.18"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = "0.2"
# Sound and pictures (M40, D36, docs/design/audio-video.md): the codecs
# of Chromium's open-source build. symphonia demuxes WebM, MP4, Ogg and
# WAV and decodes MP3, Vorbis, FLAC and PCM, in safe Rust; opus-decoder
# decodes Opus, in safe Rust; rav1d, the Rust port of dav1d, decodes
# AV1 through its C interface (media's av1 module), built without its
# assembly. libc for that interface's error numbers.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "vorbis", "pcm", "mkv", "ogg", "isomp4", "wav"] }
opus-decoder = "0.1"
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
libc = "0.2"
fontdb = "0.23"
rustybuzz = "0.20"
# A font's shaping face, which borrows the font's bytes, kept with them
# for the font's life (M35.8, docs/design/performance.md) without
# `unsafe` of our own.
self_cell = "1.3"
# A pool of threads for the layout of a container's items and cells (M35.3,
# docs/design/performance.md).
rayon = "1.12"
ab_glyph = "0.2"
ttf-parser = "0.25"
unicode-bidi = "0.3"
unicode-script = "0.5"
# The Unicode general category, for the first-letter pattern (M16,
# docs/design/selectors-pseudo.md); already in the tree through the
# shaper, with the same feature alone.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# UTS #46 for the URL parser's domains (D17; docs/design/net.md).
idna = "1.1"
# The Public Suffix List (D20; docs/design/fetch.md): a matcher
# generated from the list, for sites, cookies' domains and
# Sec-Fetch-Site.
psl = "2.1.241"
# The profile's store (D10; docs/design/storage.md): an embedded
# key-value store in one file, pure Rust, with transactions and crash
# recovery.
redb = "4.3"
# TLS for https: (D4; docs/design/net.md): rustls over the aws-lc-rs
# provider, which has the X25519MLKEM768 key exchange, and Mozilla's
# root program compiled in.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "prefer-post-quantum"] }
# The SHA-2 digests a Content Security Policy's hash sources name
# (M33.1): rustls's provider, with the features rustls enables in it.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
webpki-roots = "1"
# gzip and deflate content codings, pure Rust over miniz_oxide.
flate2 = "1"
# The OS's clipboard, for the address field (docs/design/navigation.md,
# "The clipboard and input methods"): text only, so without the image
# support its default features bring.
arboard = { version = "3", default-features = false }
# Waiting on a socket that another thread can interrupt: the abort of a
# fetch wakes its waiting read or write on every OS, where shutting a
# socket down from another thread does not on Windows.
mio = { version = "1", features = ["net", "os-poll"] }
# Certificates the tests' TLS server presents, made when they run, with
# the same cryptography provider as rustls.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
# The GPU backend (M19.3, D3): wgpu over Vulkan, Metal and Direct3D 12,
# the backends the desktop platforms have, shaders in WGSL alone;
# without the OpenGL and browser backends its default would bring, and
# the crates behind them.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }
# Blocking on wgpu's futures: the adapter, the device and a readback.
pollster = "0.4"
# The PDF a page prints to (M20.4, docs/design/media.md): written
# step by step, its page rasters Flate-compressed by `flate2` above.
pdf-writer = "0.15"
# What the operating system says of the user's preferences (M20.3,
# docs/design/media.md): Windows's system parameters and macOS's
# accessibility settings, through the versions of the crates winit and
# its neighbours already bring there, with the features those calls
# need alone; and the renderers' processes, their pipes, their job
# objects, their sandbox and their crashes' dumps (M34,
# docs/design/processes.md).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# The browser's audio output (M40, D37, docs/design/audio-video.md):
# WASAPI's COM interfaces, through the version of the crate wgpu already
# brings, with the features those calls need alone.
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

# The JavaScript engine (M24, roadmap D1, docs/design/scripting.md):
# QuickJS-ng, which rquickjs-sys builds from its C source with `cc`,
# pinned to the version the design note measured. Without the allocator
# features, under which the heap limit would do nothing.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
# WebAssembly (M29, D21; docs/design/wasm.md): an interpreter in Rust,
# validating every module; without its text format and memory64. Its
# portable dispatch, a loop: the tail-call dispatch counts on sibling
# calls LLVM does not always make, and a long loop then overflows the
# native stack.
wasmi = { version = "2.0", default-features = false, features = ["std", "validate", "portable-dispatch"] }
# wasmi's own core, for the one type of its limiter's it does not export.
wasmi_core = { version = "2.0", default-features = false }
# A module's sections in their order, which wasmi keeps not: the
# version wasmi reads modules with.
wasmparser = { version = "0.228", default-features = false, features = ["std"] }

# Dependencies are optimised even in the dev profile: the rasterizer,
# the shaper and the font parser are not what a debug build is for
# debugging, and unoptimised they put every frame far past the budget.
# Nor do they carry debug information: theirs was most of each test
# binary's debug symbols, a few hundred megabytes a binary on Windows.
# rav1d 1.1.0 with the upstream fix its release lacks (vendor/README.md).
[patch.crates-io]
rav1d = { path = "vendor/rav1d" }

[profile.dev.package."*"]
opt-level = 3
debug = false

# tiny-skia's pipeline works in 16-bit lanes that wrap, as the SIMD it
# stands for does, and works out both sides of a choice before keeping
# one (hard-light and overlay): checked, the side it drops overflows.
[profile.dev.package.tiny-skia]
overflow-checks = false

# zune-jpeg multiplies a block's DC prediction by its quantizer without a
# check; a corrupt stream runs the prediction far enough to overflow. A
# release build wraps there, the corrupt image's pixels, and so does this
# one rather than panicking (found by the nightly fuzz run at M35).
[profile.dev.package.zune-jpeg]
overflow-checks = false

# opus-decoder's CELT keeps a band's collapse mask in a u8 and shifts a
# bit into it for each of a band's blocks, which can number more than
# eight: a stream the reference encoded panics there unless the shift
# wraps, as a release build's does. This one wraps too (M40); media's
# tests hold what it then decodes to the reference's samples.
[profile.dev.package.opus-decoder]
overflow-checks = false
