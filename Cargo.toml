[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz targets need nightly and libfuzzer; they build on their own.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"

# Layer order (dependencies may only point DOWN this list):
#   shell -> { engine, ui }
#   engine -> { render, paint, layout, style, text, net, html, css } -> { dom, encoding }
#   ui -> { render, paint, text }
#   layout, paint, render -> images (a leaf: decoders, M23)
#   engine -> js (a leaf: scripts, M24)
# See docs/architecture.md — the layering contract is binding.
[workspace.dependencies]
# Internal crates
dom = { path = "crates/dom" }
encoding = { path = "crates/encoding" }
html = { path = "crates/html" }
css = { path = "crates/css" }
style = { path = "crates/style" }
layout = { path = "crates/layout" }
text = { path = "crates/text" }
net = { path = "crates/net" }
paint = { path = "crates/paint" }
images = { path = "crates/images" }
# Without their default features: the GPU backend (M19.3) is a feature
# of each, `gpu`, which the shell's own turns on down the line.
render = { path = "crates/render", default-features = false }
engine = { path = "crates/engine", default-features = false }
ui = { path = "crates/ui" }
js = { path = "crates/js" }

# External crates
winit = "0.30"
softbuffer = "0.4"
# Without its PNG support, which nothing calls: `images` decodes PNG.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# The image decoders (M23.1, docs/design/images.md): pure Rust; zune-jpeg
# without its SIMD code, which is its only unsafe code.
png = "0.18"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = "0.2"
fontdb = "0.23"
rustybuzz = "0.20"
ab_glyph = "0.2"
ttf-parser = "0.25"
unicode-bidi = "0.3"
unicode-script = "0.5"
# The Unicode general category, for the first-letter pattern (M16,
# docs/design/selectors-pseudo.md); already in the tree through the
# shaper, with the same feature alone.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# UTS #46 for the URL parser's domains (D17; docs/design/net.md).
idna = "1.1"
# The Public Suffix List (D20; docs/design/fetch.md): a matcher
# generated from the list, for sites, cookies' domains and
# Sec-Fetch-Site.
psl = "2.1.241"
# TLS for https: (D4; docs/design/net.md): rustls over the aws-lc-rs
# provider, which has the X25519MLKEM768 key exchange, and Mozilla's
# root program compiled in.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "prefer-post-quantum"] }
webpki-roots = "1"
# gzip and deflate content codings, pure Rust over miniz_oxide.
flate2 = "1"
# The OS's clipboard, for the address field (docs/design/navigation.md,
# "The clipboard and input methods"): text only, so without the image
# support its default features bring.
arboard = { version = "3", default-features = false }
# Waiting on a socket that another thread can interrupt: the abort of a
# fetch wakes its waiting read or write on every OS, where shutting a
# socket down from another thread does not on Windows.
mio = { version = "1", features = ["net", "os-poll"] }
# Certificates the tests' TLS server presents, made when they run, with
# the same cryptography provider as rustls.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
# The GPU backend (M19.3, D3): wgpu over Vulkan, Metal and Direct3D 12,
# the backends the desktop platforms have, shaders in WGSL alone;
# without the OpenGL and browser backends its default would bring, and
# the crates behind them.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }
# Blocking on wgpu's futures: the adapter, the device and a readback.
pollster = "0.4"
# The PDF a page prints to (M20.4, docs/design/media.md): written
# step by step, its page rasters Flate-compressed by `flate2` above.
pdf-writer = "0.15"
# What the operating system says of the user's preferences (M20.3,
# docs/design/media.md): Windows's system parameters and macOS's
# accessibility settings, through the versions of the crates winit and
# its neighbours already bring there, with the features those calls
# need alone.
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

# The JavaScript engine (M24, roadmap D1, docs/design/scripting.md):
# QuickJS-ng, which rquickjs-sys builds from its C source with `cc`,
# pinned to the version the design note measured. Without the allocator
# features, under which the heap limit would do nothing.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }

# Dependencies are optimised even in the dev profile: the rasterizer,
# the shaper and the font parser are not what a debug build is for
# debugging, and unoptimised they put every frame far past the budget.
[profile.dev.package."*"]
opt-level = 3
