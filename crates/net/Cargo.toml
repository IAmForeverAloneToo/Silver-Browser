[package]
name = "net"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The scripted HTTP and HTTPS server tests use, for crates whose tests
# fetch from one (the engine's), with the certificate authority that
# issues its certificates.
test-server = ["dep:rcgen"]

[dependencies]
encoding.workspace = true
flate2.workspace = true
idna.workspace = true
mio.workspace = true
psl.workspace = true
rcgen = { workspace = true, optional = true }
rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
rcgen.workspace = true
# The tests read web-platform-tests' data files, which are JSON.
serde_json = "1"
