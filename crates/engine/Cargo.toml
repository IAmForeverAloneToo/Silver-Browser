[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
css.workspace = true
dom.workspace = true
encoding.workspace = true
html.workspace = true
layout.workspace = true
net.workspace = true
paint.workspace = true
render.workspace = true
style.workspace = true
text.workspace = true

[[example]]
# The web-platform-tests pull (M17); its rule's tests run with the
# crate's.
name = "wpt"
test = true

[[example]]
# The capture of the acceptance layouts (M17); its tests run with the
# crate's.
name = "layouts"
test = true

[[bench]]
name = "scroll"
harness = false

[[bench]]
name = "mutation"
harness = false

[[bench]]
name = "load"
harness = false

[[bench]]
name = "pseudo"
harness = false

[[bench]]
name = "flex"
harness = false

[dev-dependencies]
# The scripted server the loader's tests fetch from.
net = { workspace = true, features = ["test-server"] }
png = "0.17"
