[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The GPU backend (M19.3): `Engine::new_on(Backend::Gpu)` draws on it
# where the machine has an adapter. Off, nothing of wgpu is built.
default = ["gpu"]
gpu = ["render/gpu"]

[dependencies]
js.workspace = true
devtools.workspace = true
canvas.workspace = true
css.workspace = true
dom.workspace = true
encoding.workspace = true
html.workspace = true
images.workspace = true
layout.workspace = true
net.workspace = true
paint.workspace = true
profile.workspace = true
render.workspace = true
style.workspace = true
svg.workspace = true
text.workspace = true

[[example]]
# The web-platform-tests pull (M17); its rule's tests run with the
# crate's.
name = "wpt"
test = true

[[example]]
# The capture of the acceptance layouts (M17); its tests run with the
# crate's.
name = "layouts"
test = true

