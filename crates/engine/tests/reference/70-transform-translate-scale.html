<!doctype html>
<html>
<head>
<meta name="reference-tolerance" content="2">
<title>Transforms: translations and scales of bordered boxes, drawn through — the functions, the percentages of the border box, the individual properties, the composition order of a list, and the identity</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .row { height: 130px; padding: 20px 0 0 20px; }
  .b { float: left; width: 120px; height: 60px; margin-right: 40px; background-color: #c8a46a; border: 4px solid #604a20; }
  .g { background-color: #e6dcc8; border-color: #d4c4a4; }
</style>
</head>
<body>
  <div class="row">
    <div class="b" style="transform: translate(20px, 10px)"></div>
    <div class="b" style="transform: translateX(-10px)"></div>
    <div class="b" style="transform: translateY(15px)"></div>
    <div class="b" style="transform: translate(25%, 50%)"></div>
  </div>
  <div class="row">
    <div class="b" style="transform: scale(1.5)"></div>
    <div class="b" style="transform: scale(0.5, 2)"></div>
    <div class="b" style="transform: scaleX(0.75)"></div>
    <div class="b" style="transform: matrix(1, 0, 0, 1, 10, 30)"></div>
  </div>
  <div class="row">
    <div class="b" style="transform: translate(10px, 5px) scale(0.5)"></div>
    <div class="b" style="transform: scale(2) translate(10px, 5px)"></div>
    <div class="b" style="transform: translate(0)"></div>
    <div class="b g" style="transform: none"></div>
  </div>
  <div class="row">
    <div class="b" style="translate: 10px 20px"></div>
    <div class="b" style="scale: 1.25"></div>
    <div class="b" style="rotate: 180deg; border-top-color: #3a5a7a"></div>
    <div class="b" style="translate: -10px; scale: 0.5 1.5; transform: translateX(20px)"></div>
  </div>
</body>
</html>
