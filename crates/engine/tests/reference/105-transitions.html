<!doctype html>
<html>
<head>
<title>Transitions: one running, one in its delay and past it, one reversed half way and shortened, all properties, a shorthand named, and timing and easing per property, drawn three quarters of a second after the change</title>
<!-- The bars' class changes at the first frame; the reversed one's at
     half a second; the page is drawn at three quarters. -->
<meta name="reference-change" content="all class go; back class bar back">
<meta name="reference-time" content="0 500 750">
<script src="reference-change.js"></script>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  .row { display: flex; margin: 6px 0 0 10px; }
  .cell { width: 200px; height: 24px; margin-right: 10px; background-color: #e0d8c8; }
  .bar { width: 40px; height: 24px; background-color: #3a7a4a; }
  .go .bar { width: 200px; }

  /* A second long and linear: three quarters of the way. */
  .plain { transition: width 1s linear; }
  /* A quarter of a second's delay: half way. */
  .delayed { transition: width 1s linear 0.25s; }
  /* A delay longer than the time since: not yet begun. */
  .waiting { transition: width 1s linear 1s; }
  /* Reversed half way, at 120px: the reversed transition is shortened
     to half a second, from 120px back to 40px, and half way at 80px. */
  .go #back.back { width: 40px; }
  #back { transition: width 1s linear; }
  /* All properties, a second and a half long: half way. */
  .all-properties { transition: all 1.5s linear; }
  .go .all-properties { height: 12px; }
  /* A shorthand named: its longhands transition, here margin-left. */
  .shorthand { transition: margin 1s linear; }
  .go .shorthand { width: 40px; margin-left: 80px; }
  /* A property each, its own duration and easing: the width a quarter
     of the way at 3s, the height done at half a second. */
  .each { transition-property: width, height; transition-duration: 3s, 0.5s; transition-timing-function: linear, ease; }
  .go .each { height: 8px; }
  /* Not transitioned: at its end at once. */
  .none { transition: height 1s linear; }
</style>
</head>
<body>
  <div id="all">
    <div class="row">
      <div class="cell"><div class="bar plain"></div></div>
      <div class="cell"><div class="bar delayed"></div></div>
      <div class="cell"><div class="bar waiting"></div></div>
    </div>
    <div class="row">
      <div class="cell"><div class="bar" id="back"></div></div>
      <div class="cell"><div class="bar all-properties"></div></div>
      <div class="cell"><div class="bar shorthand"></div></div>
    </div>
    <div class="row">
      <div class="cell"><div class="bar each"></div></div>
      <div class="cell"><div class="bar none"></div></div>
    </div>
  </div>
</body>
</html>
