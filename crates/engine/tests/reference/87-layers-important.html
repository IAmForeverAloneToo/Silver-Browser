<!doctype html>
<html>
<head>
<title>Important declarations in cascade layers: earlier layers over later ones, layered over unlayered, anonymous and nested layers reversed, and the style attribute, normal and important, against them</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  .c { float: left; width: 50px; height: 50px; margin: 10px 0 0 10px; background-color: #b8b0a0; }
  @layer base, theme;
  @layer base { .c1 { background-color: #3a7a4a !important; } }
  @layer theme { .c1 { background-color: #a0522d !important; } }
  .c2 { background-color: #a0522d !important; }
  @layer base { .c2 { background-color: #3a7a4a !important; } }
  @layer theme { .c3 { background-color: #3a7a4a !important; } }
  .c3 { background-color: #a0522d; }
  @layer theme { .c4 { background-color: #3a7a4a !important; } }
  @layer base { .c5 { background-color: #a0522d !important; } }
  @layer { .c6 { background-color: #3a7a4a !important; } }
  @layer { .c6 { background-color: #a0522d !important; } }
  @layer outer { @layer inner { .c7 { background-color: #3a7a4a !important; } } .c7 { background-color: #a0522d !important; } }
  @layer base { .c8 { background-color: #a0522d; } }
  .c8 { background-color: #3a7a4a; }
  @layer theme { .c9 { background-color: #a0522d !important; } }
  @layer base { .c9 { background-color: #3a7a4a !important; } }
  @layer theme { body .c.c10 { background-color: #a0522d !important; } }
  @layer base { .c10 { background-color: #3a7a4a !important; } }
</style>
</head>
<body>
  <div class="c c1"></div>
  <div class="c c2"></div>
  <div class="c c3"></div>
  <div class="c c4" style="background-color: #a0522d"></div>
  <div class="c c5" style="background-color: #3a7a4a !important"></div>
  <div class="c c6"></div>
  <div class="c c7"></div>
  <div class="c c8"></div>
  <div class="c c9"></div>
  <div class="c c10"></div>
</body>
</html>
