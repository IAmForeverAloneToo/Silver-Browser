<!doctype html>
<html>
<head>
<title>Grid: absolutely positioned children in grid areas as containing blocks, auto lines and lines the grid lacks at the padding edges, static positions in their areas by self-alignment, and in the content box when the grid is not their containing block</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .g { display: grid; margin: 8px 20px; background-color: #e6dcc8; }
  .g > div { background-color: #a07a3a; }
  .g > div:nth-child(2n) { background-color: #c8a46a; }
  .g > div:nth-child(3n) { background-color: #604a20; }
  .col { float: left; width: 400px; }
  i { display: block; background-color: #3a5a7a; }
  .g { position: relative; width: 300px; height: 140px; padding: 10px 16px; border: 4px solid #604a20; grid-template-columns: 60px 1fr 60px; grid-template-rows: 30px 1fr 30px; gap: 6px; }
  .g > .a { position: absolute; background-color: #3a5a7a; }
  .g > .a:nth-child(2n) { background-color: #7a9aba; }
  .g > .a:nth-child(3n) { background-color: #1a2a3a; }
  .outer { position: relative; margin: 8px 20px; padding: 6px; width: 340px; background-color: #d4c4a4; }
  .outer > .g { position: static; margin: 0; }
</style>
</head>
<body>
  <div class="col">
    <div class="g">
      <div style="grid-area: 1 / 1"></div><div style="grid-area: 3 / 3"></div>
      <div class="a" style="grid-area: 2 / 2 / 3 / 3; top: 0; right: 0; bottom: 0; left: 0; margin: 6px"></div>
      <div class="a" style="grid-column: 1 / 2; bottom: 0; width: 20px; height: 20px"></div>
      <div class="a" style="grid-column: 3 / 4; grid-row: 1 / 2; justify-self: end; align-self: center; width: 20px; height: 10px"></div>
      <div class="a" style="grid-column: foo / bar; grid-row: 2 / 3; left: 0; top: 0; width: 24px; height: 14px"></div>
      <div class="a" style="grid-row: 3 / span 4; grid-column: 2; right: 0; bottom: 0; width: 30px; height: 12px"></div>
    </div>
    <div class="g">
      <div class="a" style="grid-area: 2 / 2; justify-self: center; align-self: end; width: 30px; height: 20px"></div>
      <div class="a" style="grid-area: 1 / 3; place-self: center"><i style="width: 24px; height: 12px"></i></div>
      <div class="a" style="grid-area: 3 / 1 / 4 / 4; justify-self: stretch"><i style="width: 40px; height: 12px"></i></div>
      <div></div>
      <div class="a" style="grid-column: 2 / 4; grid-row: 1 / 3; width: 30px; height: 20px; margin: 4px; justify-self: end"></div>
      <div></div>
    </div>
  </div>
  <div class="col">
    <div class="outer">
      <div class="g">
        <div></div>
        <div class="a" style="grid-area: 2 / 2; width: 30px; height: 20px; justify-self: center; align-self: end"></div>
        <div class="a" style="width: 30px; height: 20px; left: 0"></div>
        <div></div>
      </div>
    </div>
    <div class="g" style="justify-content: end; align-content: center; grid-template-columns: 60px 60px; grid-template-rows: 30px 30px">
      <div></div><div></div><div></div>
      <div class="a" style="grid-area: 1 / 2 / 3 / 3; top: 0; bottom: 0; left: 0; width: 20px"></div>
      <div class="a" style="grid-column: auto / 2; grid-row: 2 / auto; right: 0; top: 0; height: 10px"></div>
    </div>
  </div>
</body>
</html>
