<!doctype html>
<html>
<head>
<title>Generated boxes: ::before and ::after as tables and table cells, and the clearfix</title>
<style>
  html { background-color: #f5f1e8; }
  body { margin: 0; }
  .clearfix { width: 400px; margin: 20px; background-color: #e2d8c0; }
  .clearfix::after { content: ""; display: table; clear: both; }
  .clearfix div { float: left; width: 100px; height: 60px; margin-right: 10px; background-color: #8a7444; }
  .open { width: 400px; margin: 20px; background-color: #e2d8c0; }
  .open div { float: left; width: 100px; height: 40px; background-color: #8a7444; }
  table { border-spacing: 4px; margin: 20px; background-color: #c9b98f; }
  td { padding: 0; background-color: #efe6d0; }
  td div { width: 50px; height: 30px; background-color: #5c4a22; }
  tr::before { content: ""; display: table-cell; width: 40px; background-color: #b39a5e; }
  tr::after { content: ""; display: table-cell; width: 20px; background-color: #7a6431; }
  .cells { display: table; border-spacing: 0; margin: 20px; background-color: #c9b98f; }
  .cells::before { content: ""; display: table-cell; width: 30px; background-color: #b39a5e; }
  .cells::after { content: ""; display: table-cell; width: 60px; background-color: #7a6431; }
  .cells div { width: 80px; height: 50px; background-color: #5c4a22; }
  .tables::before { content: ""; display: table; width: 200px; height: 30px; margin: 0 20px; background-color: #5c4a22; }
  .tables::after { content: ""; display: table; width: 100px; height: 20px; margin: 10px 20px; background-color: #b39a5e; }
</style>
</head>
<body>
  <div class="clearfix"><div></div><div></div></div>
  <div class="open"><div></div></div>
  <table><tr><td><div></div></td><td><div></div></td></tr></table>
  <div class="cells"><div></div></div>
  <div class="tables"></div>
</body>
</html>
