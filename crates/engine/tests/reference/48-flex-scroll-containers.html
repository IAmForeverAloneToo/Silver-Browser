<!doctype html>
<html>
<head>
<title>Flex: scroll containers, items that clip their content, padding and borders around the clip, containers that clip their items on either side and below, a clipping flex item</title>
<style>
  html { background-color: #f2eef6; }
  body { margin: 0; }
  .f { display: flex; width: 300px; height: 60px; margin: 20px 20px 20px 100px; background-color: #ddd4e8; }
  .f > div { height: 50px; background-color: #6a4a8a; }
  .f > div:nth-child(2) { background-color: #a88ac8; }
  .f > div:nth-child(3) { background-color: #3a2a4a; }
  .f > div > div { width: 200px; height: 70px; flex: none; background-color: #2a1a3a; }
  .f > div:nth-child(2) > div { background-color: #f0e8f8; }
  .hidden { overflow: hidden; }
  .grow > div { flex: 1 1 0; }
  .boxed > div { padding: 8px; border: 4px solid #1a0a2a; }
  .wide > div { flex: none; width: 120px; }
  .c { flex-direction: column; float: left; width: 120px; height: 120px; margin: 20px 0 0 100px; }
  .c > div { flex: none; width: 100px; height: 50px; }
  .clear { clear: left; float: left; }
</style>
</head>
<body>
  <div class="f grow"><div class="hidden"><div></div></div><div class="hidden"><div></div></div></div>
  <div class="f grow boxed"><div class="hidden"><div></div></div><div><div></div></div></div>
  <div class="f wide hidden"><div></div><div></div><div></div></div>
  <div class="f wide hidden" style="justify-content: flex-end"><div></div><div></div><div></div></div>
  <div class="f c hidden"><div></div><div></div><div></div></div>
  <div class="f c hidden" style="justify-content: center; align-items: center"><div style="width: 160px"></div><div></div><div style="width: 160px"></div></div>
  <div class="f clear" style="width: 300px"><div class="hidden" style="display: flex; flex: 1; padding: 5px; justify-content: center"><div></div><div style="width: 40px"></div></div><div style="width: 60px; flex: none"></div></div>
</body>
</html>
