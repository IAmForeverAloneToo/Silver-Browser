<!doctype html>
<html>
<head>
<meta name="reference-tolerance" content="1">
<meta name="reference-edge-tolerance" content="80">
<title>SVG (M32): viewBox and preserveAspectRatio, meet and slice at each alignment and none, an svg sized by CSS and by its ratio alone, the transforms (translate, scale, rotate about a point, skews, a matrix) nested, and a nested svg with its own viewport, clipped and not; no text</title>
<style>
  html { background-color: #eef0f3; }
  body { margin: 10px; }
  svg { display: block; float: left; margin: 0 10px 10px 0; background-color: #ffffff; }
  .css { width: 120px; height: 60px; }
  .ratio { width: 90px; }
</style>
</head>
<body>
<svg width="120" height="60" viewBox="0 0 40 40" preserveAspectRatio="xMinYMid meet">
  <rect width="40" height="40" fill="#7f9fbf"/><circle cx="20" cy="20" r="15" fill="#2f4f6f"/>
</svg>
<svg width="120" height="60" viewBox="0 0 40 40">
  <rect width="40" height="40" fill="#7f9fbf"/><circle cx="20" cy="20" r="15" fill="#2f4f6f"/>
</svg>
<svg width="120" height="60" viewBox="0 0 40 40" preserveAspectRatio="xMaxYMax meet">
  <rect width="40" height="40" fill="#7f9fbf"/><circle cx="20" cy="20" r="15" fill="#2f4f6f"/>
</svg>
<svg width="120" height="60" viewBox="0 0 40 40" preserveAspectRatio="none">
  <rect width="40" height="40" fill="#7f9fbf"/><circle cx="20" cy="20" r="15" fill="#2f4f6f"/>
</svg>
<svg width="120" height="60" viewBox="0 0 40 40" preserveAspectRatio="xMidYMin slice">
  <rect width="40" height="40" fill="#7f9fbf"/><circle cx="20" cy="20" r="15" fill="#8f3f2f"/>
</svg>
<svg width="60" height="120" viewBox="0 0 40 40" preserveAspectRatio="xMaxYMid slice">
  <rect width="40" height="40" fill="#7f9fbf"/><circle cx="20" cy="20" r="15" fill="#8f3f2f"/>
</svg>
<svg class="css" viewBox="-20 -20 80 40">
  <rect x="-20" y="-20" width="80" height="40" fill="#eef0f3"/><rect width="40" height="20" fill="#5f7f9f"/>
</svg>
<svg class="ratio" viewBox="0 0 30 20">
  <rect width="30" height="20" fill="#5f7f9f"/><path d="M0 20 L15 0 L30 20 Z" fill="#2f4f6f"/>
</svg>
<svg width="240" height="120">
  <g transform="translate(20 20)">
    <rect width="30" height="30" fill="#2f4f6f"/>
    <g transform="translate(50 0) scale(1.5 0.75)">
      <rect width="30" height="30" fill="#5f7f9f"/>
    </g>
    <rect x="110" y="0" width="30" height="30" fill="#7f9fbf" transform="rotate(30 125 15)"/>
    <rect x="160" y="0" width="30" height="30" fill="#8f3f2f" transform="skewX(20)"/>
    <g transform="matrix(1 0.3 -0.2 1 10 50)">
      <rect width="60" height="30" fill="#7f9fbf"/>
      <rect x="100" width="40" height="30" fill="#2f4f6f" transform="skewY(-15) scale(-1 1) translate(-140 0)"/>
    </g>
  </g>
</svg>
<svg width="240" height="120">
  <rect width="240" height="120" fill="#eef0f3"/>
  <svg x="10" y="10" width="100" height="100" viewBox="0 0 10 10">
    <rect width="10" height="10" fill="#7f9fbf"/>
    <circle cx="10" cy="10" r="6" fill="#2f4f6f"/>
  </svg>
  <svg x="130" y="10" width="100" height="100" viewBox="0 0 10 10" overflow="visible">
    <rect width="10" height="10" fill="#7f9fbf"/>
    <circle cx="10" cy="10" r="6" fill="#8f3f2f" opacity="0.7"/>
  </svg>
</svg>
</body>
</html>
