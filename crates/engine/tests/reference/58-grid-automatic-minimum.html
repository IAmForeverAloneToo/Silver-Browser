<!doctype html>
<html>
<head>
<title>Grid: the automatic minimum keeps content whole, and minmax(0, 1fr) lets it go</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .g { display: grid; margin: 8px 20px; background-color: #e6dcc8; }
  .g > div { background-color: #a07a3a; }
  .g > div:nth-child(2n) { background-color: #c8a46a; }
  .g > div:nth-child(3n) { background-color: #604a20; }
  .col { float: left; width: 400px; }
  i { display: block; background-color: #3a5a7a; }
  .a { width: 200px; grid-template-columns: 1fr 1fr; }
  .b { width: 200px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .c { width: 200px; grid-template-columns: 1fr 1fr; }
  .c > div { min-width: 0; }
  .d { width: 200px; grid-template-columns: 1fr 1fr; }
  .d > div { overflow: hidden; }
  .e { width: 200px; grid-template-columns: 60px 1fr; }

</style>
</head>
<body>
  <div class="col">
    <div class="g a"><div><i style="width: 150px; height: 20px"></i></div><div><i style="width: 20px; height: 20px"></i></div></div>
    <div class="g b"><div><i style="width: 150px; height: 20px"></i></div><div><i style="width: 20px; height: 20px"></i></div></div>
    <div class="g c"><div><i style="width: 150px; height: 20px"></i></div><div><i style="width: 20px; height: 20px"></i></div></div>
    <div class="g d"><div><i style="width: 150px; height: 20px"></i></div><div><i style="width: 20px; height: 20px"></i></div></div>
    <div class="g e"><div><i style="width: 100px; height: 20px"></i></div><div><i style="width: 150px; height: 20px"></i></div></div>
  </div>
</body>
</html>
