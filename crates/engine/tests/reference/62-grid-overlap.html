<!doctype html>
<html>
<head>
<title>Grid: items that share cells paint in order-modified document order, those with a z-index at their layer, positioned ones above, and one with a negative z-index under its grid or in its grid's stacking context</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .g { display: grid; margin: 8px 20px; background-color: #e6dcc8; }
  .g > div { background-color: #a07a3a; }
  .g > div:nth-child(2n) { background-color: #c8a46a; }
  .g > div:nth-child(3n) { background-color: #604a20; }
  .col { float: left; width: 400px; }
  .g { width: 340px; grid-template-columns: repeat(3, 100px); grid-template-rows: 50px 50px; gap: 14px; }
  .p { grid-area: 1 / 1; margin: 0 40px 20px 0; }
  .q { grid-area: 1 / 1; margin: 10px 20px; }
  .r { grid-area: 1 / 1; margin: 20px 0 0 40px; }
  .x .p, .x .q, .x .r { grid-column: 2; }
  .y .p, .y .q, .y .r { grid-column: 3; }
  .z .p, .z .q, .z .r { grid-row: 2; }
  .w .p, .w .q, .w .r { grid-row: 2; grid-column: 2; }
  .v .p, .v .q, .v .r { grid-row: 2; grid-column: 3; }
  .ctx { position: relative; z-index: 0; }
  .span { grid-area: 1 / 1 / 3 / 3; margin: 20px; }
</style>
</head>
<body>
  <div class="col">
    <div class="g"><div class="p"></div><div class="q"></div><div class="r"></div></div>
    <div class="g x"><div class="p"></div><div class="q"></div><div class="r" style="order: -1"></div></div>
    <div class="g y"><div class="p" style="z-index: 1"></div><div class="q" style="z-index: 0"></div><div class="r"></div></div>
  </div>
  <div class="col">
    <div class="g z"><div class="p" style="position: relative"></div><div class="q"></div><div class="r" style="position: relative; top: -10px"></div></div>
    <div class="g w"><div class="p"></div><div class="q" style="z-index: -1; margin-bottom: -6px"></div><div class="r"></div></div>
    <div class="g v ctx"><div class="p"></div><div class="q" style="z-index: -1; margin-bottom: -6px"></div><div class="r"></div></div>
    <div class="g"><div style="grid-area: 2 / 2 / 3 / 4"></div><div class="span" style="z-index: 1"></div><div style="grid-area: 1 / 2 / 3 / 3; margin: 10px"></div></div>
  </div>
</body>
</html>
