<!doctype html>
<html>
<head>
<title>vw, vh, vmin, vmax and rem</title>
<style>
  html { background-color: #e9eef6; font-size: 20px; }
  body { margin: 0; font-size: 14px; }
  .vw { width: 50vw; height: 25vh; margin: 2rem; padding: 1rem; background-color: #2f5d9e; }
  .vw div { width: 10vmin; height: 10vmax; background-color: #ffffff; }
  .rem { width: 10rem; height: 5rem; margin: 0 2rem; padding: 0.5rem; border: 0.25rem solid #12264a; background-color: #8fb3e6; }
  .em { width: 10em; height: 5em; margin: 1rem 2rem; background-color: #2f5d9e; }
  .mixed { width: 20vw; height: 5vh; margin: 1rem 0 0 10vw; min-height: 2rem; background-color: #12264a; }
</style>
</head>
<body>
  <div class="vw"><div></div></div>
  <div class="rem"></div>
  <div class="em"></div>
  <div class="mixed"></div>
</body>
</html>
