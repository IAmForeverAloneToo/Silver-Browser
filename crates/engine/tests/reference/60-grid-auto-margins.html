<!doctype html>
<html>
<head>
<title>Grid: auto margins in grid areas, on either side and both, against self-alignment, with fixed margins, on items sized to fit, and on an item that overflows its area</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .g { display: grid; margin: 8px 20px; background-color: #e6dcc8; }
  .g > div { background-color: #a07a3a; }
  .g > div:nth-child(2n) { background-color: #c8a46a; }
  .g > div:nth-child(3n) { background-color: #604a20; }
  .col { float: left; width: 400px; }
  i { display: block; background-color: #3a5a7a; }
  .a { width: 360px; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 50px; gap: 6px; }
  .a > div { width: 40px; height: 20px; }
  .b { width: 360px; grid-template-columns: 100px 100px; grid-template-rows: 60px 60px; justify-items: center; align-items: end; }
  .b > div { width: 40px; height: 20px; }
</style>
</head>
<body>
  <div class="col">
    <div class="g a">
      <div style="margin: auto"></div><div style="margin-left: auto"></div><div style="margin-top: auto"></div>
      <div style="margin: 0 auto"></div><div style="margin: auto 0"></div><div style="margin-right: auto; justify-self: end"></div>
      <div style="margin: auto; width: 140px"></div><div style="width: auto; margin-left: auto"><i style="width: 30px; height: 20px"></i></div><div style="height: auto; margin-top: auto"><i style="width: 30px; height: 12px"></i></div>
      <div style="margin: 5px auto 5px 10px"></div><div style="margin: auto; align-self: end"></div><div style="margin-left: auto; margin-right: 10px"></div>
    </div>
  </div>
  <div class="col">
    <div class="g b">
      <div style="margin-left: 20px"></div><div style="margin-bottom: 10px"></div>
      <div style="grid-column: span 2; width: 60px; margin: auto"></div>
    </div>
  </div>
</body>
</html>
