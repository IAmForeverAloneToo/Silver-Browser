<!doctype html>
<html>
<head>
<title>Frames (M33): srcdoc frames at the default size and at sizes their attributes and CSS give, with the default inset border, frameborder=0, a CSS border and padding, and one whose document has no background, the parent's showing through; no text</title>
<style>
  html { background-color: #eef0f3; }
  body { margin: 10px; }
  iframe { display: block; float: left; margin: 0 10px 10px 0; }
  .styled { width: 80px; height: 40px; border: 4px solid #8f3f2f; padding: 3px; }
  .bare { width: 60px; height: 60px; border: 0; }
  .wide { width: 200px; height: 30px; border-width: 6px; }
</style>
</head>
<body>
<iframe srcdoc="<body style='margin:0;background-color:#7f9fbf'><div style='width:50px;height:30px;background-color:#2f4f6f'></div>"></iframe>
<iframe width="120" height="60" srcdoc="<body style='margin:0;background-color:#bf9f7f'><div style='margin:5px;width:40px;height:40px;background-color:#6f4f2f'></div>"></iframe>
<iframe frameborder="0" width="100" height="50" srcdoc="<body style='margin:0;background-color:#7fbf9f'>"></iframe>
<iframe class="styled" srcdoc="<body style='margin:0;background-color:#9f7fbf'><div style='width:100%;height:10px;background-color:#4f2f6f'></div>"></iframe>
<iframe class="bare" srcdoc="<body style='margin:0'><div style='margin:10px;width:20px;height:20px;background-color:#3f8f4f'></div>"></iframe>
<iframe class="wide" srcdoc="<body style='margin:0;background-color:#bfbf7f'>"></iframe>
</body>
</html>
