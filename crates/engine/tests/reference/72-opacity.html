<!doctype html>
<html>
<head>
<meta name="reference-tolerance" content="2">
<title>Opacity: a faded box over the canvas at a half, a quarter, nothing and one; nested opacity; a faded box over another box; a faded box whose border, child and overlapping children composite as one group</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .cell { float: left; position: relative; width: 160px; height: 120px; margin: 20px 0 0 30px; }
  .p { position: absolute; left: 20px; top: 20px; width: 120px; height: 80px; background-color: #604a20; }
  .u { position: absolute; left: 0; top: 60px; width: 100px; height: 60px; background-color: #d98c8c; }
  .k { position: absolute; width: 60px; height: 50px; }
</style>
</head>
<body>
  <div class="cell"><div class="p" style="opacity: 0.5"></div></div>
  <div class="cell"><div class="p" style="opacity: 0.25"></div></div>
  <div class="cell"><div class="p" style="opacity: 0"></div></div>
  <div class="cell"><div class="p" style="opacity: 1"></div></div>
  <div class="cell"><div class="p" style="opacity: 0.5; background-color: #3a5a7a"><div class="k" style="left: 30px; top: 20px; opacity: 0.5; background-color: #c8a46a"></div></div></div>
  <div class="cell"><div class="u"></div><div class="p" style="opacity: 0.5; background-color: #3a5a7a"></div></div>
  <div class="cell"><div class="p" style="opacity: 0.5; border: 10px solid #a07a3a; width: 100px; height: 60px"><div class="k" style="left: 10px; top: 10px; background-color: #3a5a7a"></div></div></div>
  <div class="cell"><div class="p" style="opacity: 0.5"><div class="k" style="left: 10px; top: 10px; background-color: #3a5a7a"></div><div class="k" style="left: 40px; top: 25px; background-color: #c8a46a"></div></div></div>
  <div class="cell"><div class="u"></div><div class="p" style="opacity: 0.75; background-color: #3a5a7a"><div class="k" style="left: -10px; top: 40px; width: 140px; opacity: 0.5; background-color: #f6f2ea"></div></div></div>
  <div class="cell"><div class="p" style="opacity: 0.5; width: 60px"></div><div class="p" style="opacity: 0.5; left: 60px; width: 80px; background-color: #3a5a7a"></div></div>
  <div class="cell"><div class="p" style="opacity: 0.999"></div></div>
  <div class="cell"><div class="p" style="opacity: 0.5"><div class="k" style="left: 0; top: 0; width: 120px; height: 80px; opacity: 0; background-color: #ff0000"></div></div></div>
  <div class="cell"><div class="p" style="opacity: 0.5; border: 10px solid #a07a3a; width: 100px; height: 60px; background-color: #f6f2ea"></div></div>
  <div class="cell"><div class="p" style="opacity: 0.5; background-color: #ffffff"><div class="k" style="left: 20px; top: 15px; background-color: #000000"></div></div></div>
  <div class="cell"><div class="p" style="opacity: 0.5"><div class="p" style="left: 20px; top: 20px; width: 60px; height: 40px; opacity: 0.5; background-color: #3a5a7a"><div class="k" style="left: 10px; top: 10px; width: 40px; height: 20px; opacity: 0.5; background-color: #d98c8c"></div></div></div></div>
</body>
</html>
