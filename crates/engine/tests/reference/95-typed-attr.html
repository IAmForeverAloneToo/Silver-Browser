<!doctype html>
<html>
<head>
<title>Typed attr(): attributes read as lengths, numbers with a unit, percentages and colours, in calc() and shorthands, with fallbacks for an attribute missing or not of the type, and through a custom property</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  .c { float: left; width: 50px; height: 50px; margin: 10px 0 0 10px; background-color: #b8b0a0; }

  /* A length, a number with px for its unit, one with em, and a
     percentage of the containing block. */
  .c1 { width: attr(data-w type(<length>)); }
  .c2 { width: attr(data-n px); }
  .c3 { width: attr(data-n em, 10px); }
  .c4 { width: attr(data-p %); }

  /* Colours, and one of a choice of types. */
  .c5 { background-color: attr(data-c type(<color>)); }
  .c6 { background-color: attr(data-c type(<color> | <length>)); }
  .c7 { height: attr(data-c type(<color> | <length>), 20px); }

  /* In calc() and a shorthand. */
  .c8 { width: calc(attr(data-n px) * 2 - 10px); }
  .c9 { margin: attr(data-m type(<length>+)); }

  /* Missing, empty, or not of the type: the fallback, or the property
     unset without one. */
  .c10 { background-color: attr(data-missing type(<color>), #3a7a4a); }
  .c11 { width: attr(data-w type(<length>), 20px); }
  .c12 { background-color: #a0522d; background-color: attr(data-c type(<color>)); }
  .c13 { width: attr(data-w px, 30px); }

  /* Through a custom property, read on the element that uses it. */
  .c14 { --from-attr: attr(data-c type(<color>), #a0522d); }
  .c14 > div { width: 30px; height: 30px; background-color: var(--from-attr); }
</style>
</head>
<body>
  <div class="c c1" data-w="30px"></div>
  <div class="c c2" data-n="20"></div>
  <div class="c c3" data-n="2"></div>
  <div class="c c4" data-p="5"></div>
  <div class="c c5" data-c="#3a7a4a"></div>
  <div class="c c6" data-c="#2f4f7f"></div>
  <div class="c c7" data-c="30px"></div>
  <div class="c c8" data-n="25"></div>
  <div class="c c9" data-m="20px 0 0 30px"></div>
  <div class="c c10"></div>
  <div class="c c11" data-w="wide"></div>
  <div class="c c12" data-c="12px"></div>
  <div class="c c13" data-w="40px"></div>
  <div class="c c14" data-c="#3a7a4a"><div data-c="#2f4f7f"></div></div>
</body>
</html>
