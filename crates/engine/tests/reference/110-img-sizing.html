<!doctype html>
<html>
<head>
<title>Images: their natural size, one side given, both, attributes, limits and aspect-ratio, and object-fit and object-position in boxes, drawn pixelated</title>
<meta name="reference-load" content="file">
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  img { position: absolute; image-rendering: pixelated; }
  .box { background-color: #b8b0a0; width: 60px; height: 60px; top: 80px; }
</style>
</head>
<body>
  <!-- quad.png is 20 by 10: red, blue / green, yellow. -->
  <img src="images/quad.png" style="left: 10px; top: 10px">
  <img src="images/quad.png" style="left: 40px; top: 10px; width: 40px">
  <img src="images/quad.png" style="left: 90px; top: 10px; height: 40px">
  <img src="images/quad.png" style="left: 180px; top: 10px; width: 60px; height: 20px">
  <img src="images/quad.png" width="60" style="left: 250px; top: 10px">
  <img src="images/quad.png" width="30" height="40" style="left: 320px; top: 10px">
  <img src="images/quad.png" style="left: 360px; top: 10px; max-width: 10px">
  <img src="images/quad.png" style="left: 380px; top: 10px; min-height: 30px">
  <img src="images/quad.png" style="left: 450px; top: 10px; width: 30px; aspect-ratio: 1 / 1">
  <img src="images/quad.png" style="left: 490px; top: 10px; width: 30px; aspect-ratio: auto 1 / 1">
  <img src="images/quad.png" style="left: 530px; top: 10px; width: 40px; border: 4px solid #2f4f7f; padding: 3px; background-color: #b8b0a0">

  <img src="images/quad.png" class="box" style="left: 10px; object-fit: contain">
  <img src="images/quad.png" class="box" style="left: 80px; object-fit: cover">
  <img src="images/quad.png" class="box" style="left: 150px; object-fit: none">
  <img src="images/quad.png" class="box" style="left: 220px; object-fit: scale-down; height: 10px">
  <img src="images/quad.png" class="box" style="left: 290px; object-fit: none; object-position: right bottom">
  <img src="images/quad.png" class="box" style="left: 360px; object-fit: contain; object-position: 0 0">
  <img src="images/quad.png" class="box" style="left: 430px; object-fit: cover; object-position: 100% 0">
  <img src="images/quad.png" class="box" style="left: 500px">
  <img src="images/quad.png" class="box" style="left: 570px; object-fit: none; object-position: 10px 20px">
</body>
</html>
