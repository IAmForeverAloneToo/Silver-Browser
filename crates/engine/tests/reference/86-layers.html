<!doctype html>
<html>
<head>
<title>Cascade layers: the order a statement gives, unlayered over layered, layer over specificity, anonymous, nested and dotted layers, layers in @media and @supports, a layer named only under a false query, and the style attribute over them</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  @layer cells, base, theme;
  @layer cells { .c { float: left; width: 50px; height: 50px; margin: 10px 0 0 10px; background-color: #b8b0a0; } }

  @layer theme { .c1 { background-color: #3a7a4a; } }
  @layer base { .c1 { background-color: #a0522d; } }
  .c2 { background-color: #3a7a4a; }
  @layer base { .c2 { background-color: #a0522d; } }
  @layer base { body .c.c3 { background-color: #a0522d; } }
  @layer theme { .c3 { background-color: #3a7a4a; } }
  @layer { .c4 { background-color: #a0522d; } }
  @layer { .c4 { background-color: #3a7a4a; } }
  @layer outer { @layer inner { .c5 { background-color: #a0522d; } } .c5 { background-color: #3a7a4a; } }
  @layer outer.inner2 { .c6 { background-color: #3a7a4a; } }
  @layer outer.inner { .c6 { background-color: #a0522d; } }
  @layer theme { @media (min-width: 100px) { .c7 { background-color: #3a7a4a; } } }
  @layer base { .c7 { background-color: #a0522d; } }
  @media print { @layer zsecond; }
  @layer zfirst { .c8 { background-color: #3a7a4a; } }
  @layer zsecond { .c8 { background-color: #a0522d; } }
  @layer base { .c9 { background-color: #3a7a4a; } }
  .c9 { border-color: #a0522d; }
  @layer theme { .c10 { background-color: #a0522d; } }
  @supports (display: grid) { @layer base { .c11 { background-color: #a0522d; } } }
  @layer theme { .c11 { background-color: #3a7a4a; } }
  @layer base { .c12 { background-color: #3a7a4a; } }
  @layer base { .c12 { width: 30px; } }
</style>
</head>
<body>
  <div class="c c1"></div>
  <div class="c c2"></div>
  <div class="c c3"></div>
  <div class="c c4"></div>
  <div class="c c5"></div>
  <div class="c c6"></div>
  <div class="c c7"></div>
  <div class="c c8"></div>
  <div class="c c9"></div>
  <div class="c c10" style="background-color: #3a7a4a"></div>
  <div class="c c11"></div>
  <div class="c c12"></div>
</body>
</html>
