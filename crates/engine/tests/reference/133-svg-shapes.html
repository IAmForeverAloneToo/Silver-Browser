<!doctype html>
<html>
<head>
<meta name="reference-tolerance" content="2">
<meta name="reference-edge-tolerance" content="80">
<title>SVG (M32): inline svgs of the basic shapes, a rect with its corners rounded, a circle, an ellipse, a line, a polyline and a polygon, paths of lines, curves and arcs, the even-odd fill rule, opacity, fill-opacity and a group's opacity over what it overlaps; no text</title>
<style>
  html { background-color: #eef0f3; }
  body { margin: 10px; }
  svg { display: block; float: left; margin: 0 10px 10px 0; background-color: #ffffff; }
</style>
</head>
<body>
<svg width="160" height="120">
  <rect x="10" y="10" width="60" height="40" fill="#2f4f6f"/>
  <rect x="90" y="10" width="60" height="40" rx="12" fill="#5f7f9f"/>
  <rect x="10" y="60" width="60" height="50" rx="10" ry="20" fill="#7f9fbf"/>
  <rect x="90" y="60" width="60" height="50" rx="40" fill="#8f3f2f"/>
</svg>
<svg width="160" height="120">
  <circle cx="40" cy="40" r="30" fill="#2f4f6f"/>
  <ellipse cx="115" cy="40" rx="35" ry="20" fill="#5f7f9f"/>
  <circle cx="40" cy="90" r="20" fill="none" stroke="#8f3f2f" stroke-width="6"/>
  <ellipse cx="115" cy="90" rx="20" ry="25" fill="#7f9fbf" stroke="#2f4f6f" stroke-width="4"/>
</svg>
<svg width="160" height="120">
  <line x1="10" y1="10" x2="150" y2="30" stroke="#2f4f6f" stroke-width="4"/>
  <polyline points="10,50 40,90 70,50 100,90 130,50 150,110" fill="none" stroke="#8f3f2f" stroke-width="3"/>
  <polygon points="20,110 50,60 80,110" fill="#7f9fbf"/>
</svg>
<svg width="160" height="120">
  <path d="M10 10 H70 V50 H40 Z" fill="#2f4f6f"/>
  <path d="M90 50 C90 0 150 0 150 50 S110 80 90 50" fill="#5f7f9f"/>
  <path d="M10 110 Q40 60 70 110 T130 110" fill="none" stroke="#8f3f2f" stroke-width="3"/>
  <path d="M90 70 a20 20 0 1 0 40 0 a20 20 0 0 1 -40 0" fill="#7f9fbf"/>
</svg>
<svg width="160" height="120">
  <path d="M10 10 h60 v60 h-60 z M25 25 v30 h30 v-30 z" fill="#2f4f6f" fill-rule="evenodd"/>
  <path d="M90 10 h60 v60 h-60 z M105 25 h30 v30 h-30 z" fill="#5f7f9f"/>
  <path d="M10 80 l30 30 l30 -30 z m20 0 l10 10 l10 -10 z" fill="#8f3f2f" fill-rule="evenodd"/>
  <polygon points="90,115 110,80 130,115 90,92 130,92" fill="#7f9fbf" fill-rule="evenodd"/>
</svg>
<svg width="160" height="120">
  <rect x="10" y="10" width="80" height="60" fill="#2f4f6f"/>
  <rect x="40" y="30" width="80" height="60" fill="#8f3f2f" opacity="0.5"/>
  <circle cx="110" cy="60" r="40" fill="#7f9fbf" fill-opacity="0.6"/>
  <g opacity="0.5">
    <rect x="20" y="80" width="60" height="30" fill="#2f4f6f"/>
    <rect x="50" y="90" width="60" height="25" fill="#2f4f6f"/>
  </g>
</svg>
</body>
</html>
