<!doctype html>
<html>
<head>
<title>Flex: justify-content, every value, on a line with room left over and on one that overflows</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  .f { display: flex; width: 330px; height: 24px; margin: 8px 20px; background-color: #e6dcc8; }
  .f div { flex: none; width: 50px; height: 20px; background-color: #a07a3a; }
  .f div:nth-child(2) { background-color: #c8a46a; }
  .f div:nth-child(3) { background-color: #604a20; }
  .over { width: 120px; margin-left: 200px; }
  .col { float: left; width: 400px; }
</style>
</head>
<body>
  <div class="col">
    <div class="f" style="justify-content: flex-start"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: flex-end"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: center"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: space-between"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: space-around"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: space-evenly"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: start"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: end"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: left"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: right"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: normal"><div></div><div></div><div></div></div>
    <div class="f" style="justify-content: space-between"><div></div></div>
    <div class="f" style="justify-content: space-around"><div></div></div>
  </div>
  <div class="col">
    <div class="f over" style="justify-content: center"><div></div><div></div><div></div></div>
    <div class="f over" style="justify-content: safe center"><div></div><div></div><div></div></div>
    <div class="f over" style="justify-content: flex-end"><div></div><div></div><div></div></div>
    <div class="f over" style="justify-content: safe flex-end"><div></div><div></div><div></div></div>
    <div class="f over" style="justify-content: space-between"><div></div><div></div><div></div></div>
    <div class="f over" style="justify-content: space-around"><div></div><div></div><div></div></div>
    <div class="f over" style="justify-content: space-evenly"><div></div><div></div><div></div></div>
  </div>
</body>
</html>
