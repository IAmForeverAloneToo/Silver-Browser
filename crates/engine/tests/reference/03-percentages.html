<!doctype html>
<html>
<head>
<title>Percentage widths, margins and paddings</title>
<style>
  html { background-color: #eef3ee; }
  body { margin: 0; }
  .wrap {
    width: 500px;
    margin: 0 50px;
    padding: 2%;
    background-color: #b7cdb0;
  }
  .half {
    width: 50%;
    height: 40px;
    margin: 5% 10%;
    padding: 4%;
    background-color: #4a7c59;
  }
  .quarter {
    width: 20%;
    height: 30px;
    margin: 0 0 0 20%;
    padding: 2% 6%;
    background-color: #ffffff;
  }
  .full {
    width: 100%;
    height: 20px;
    margin-top: 3%;
    background-color: #1e3f2a;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="half">
      <div class="quarter"></div>
    </div>
    <div class="full"></div>
  </div>
</body>
</html>
