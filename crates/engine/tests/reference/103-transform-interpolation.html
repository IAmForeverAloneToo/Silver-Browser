<!doctype html>
<html>
<head>
<title>Transforms interpolated half way: pairs of one primitive, none against a list, lists that differ decomposed as matrices in two and three dimensions, perspective, the discrete fallback of a matrix that cannot be decomposed, percentages resolved with the box, and the translate, rotate and scale properties</title>
<meta name="reference-edge-tolerance" content="128">
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  .row { display: flex; margin: 10px 0 0 10px; }
  .cell { position: relative; width: 100px; height: 100px; margin-right: 10px; background-color: #e0d8c8; }
  .deep { perspective: 300px; }
  /* A 40px square in the cell's middle, its animation a second long,
     linear and held half way unless it says otherwise. */
  .box { position: absolute; left: 30px; top: 30px; width: 40px; height: 40px; background-color: #3a7a4a;
         animation-duration: 1s; animation-timing-function: linear; animation-play-state: paused; animation-delay: -0.5s; }
  .early { animation-delay: -0.25s; }
  .late { animation-delay: -0.75s; }

  /* Pairs of one primitive, function by function. */
  @keyframes translate-x { from { transform: translateX(0px); } to { transform: translateX(40px); } }
  @keyframes scale-up { from { transform: scale(1); } to { transform: scale(2); } }
  @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
  @keyframes skew { from { transform: skewX(0deg); } to { transform: skewX(40deg); } }
  @keyframes two { from { transform: translate(0px, 0px) scale(1); } to { transform: translate(-20px, 20px) scale(0.5); } }
  /* none against a list: the list's identity functions. */
  @keyframes from-none { from { transform: none; } to { transform: translateY(-30px) rotate(60deg); } }
  @keyframes to-none { from { transform: scale(2, 0.5); } to { transform: none; } }
  /* Lists that differ: matrices, decomposed in two dimensions. */
  @keyframes orders { from { transform: rotate(0deg) translateX(0px); } to { transform: translateX(40px) rotate(90deg); } }
  @keyframes matrix { from { transform: matrix(1, 0, 0, 1, 0, 0); } to { transform: matrix(0, 1, -1, 0, 20, -20); } }
  /* And in three, under the cell's perspective. */
  @keyframes axes { from { transform: rotateX(0deg); } to { transform: rotateY(80deg); } }
  @keyframes deep { from { transform: translateZ(0px) rotateY(0deg); } to { transform: rotateX(60deg) translateZ(40px); } }
  /* Perspective, interpolated through its reciprocal. */
  @keyframes perspective { from { transform: perspective(400px) rotateY(50deg); } to { transform: perspective(100px) rotateY(50deg); } }
  /* A matrix that cannot be decomposed: discrete, the first half from,
     the second to. */
  @keyframes singular { from { transform: scale(0); } to { transform: translateX(30px) rotate(45deg); } }
  /* Percentages, of the box: function by function, and in a matrix. */
  @keyframes percent { from { transform: translateX(0%); } to { transform: translateX(100%); } }
  @keyframes percent-matrix { from { transform: translate(100%, 50%); } to { transform: scale(1.5); } }
  /* The individual properties. */
  @keyframes translate { from { translate: 0px 0px; } to { translate: 40px -20px; } }
  @keyframes rotate { from { rotate: 0deg; } to { rotate: 90deg; } }
  @keyframes scale { from { scale: 1; } to { scale: 2 0.5; } }
  @keyframes all { from { translate: 0px; rotate: 0deg; scale: 1; } to { translate: 20px; rotate: 30deg; scale: 1.5; } }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="box" style="animation-name: translate-x"></div></div>
    <div class="cell"><div class="box" style="animation-name: scale-up"></div></div>
    <div class="cell"><div class="box" style="animation-name: turn"></div></div>
    <div class="cell"><div class="box" style="animation-name: skew"></div></div>
    <div class="cell"><div class="box" style="animation-name: two"></div></div>
    <div class="cell"><div class="box" style="animation-name: from-none"></div></div>
    <div class="cell"><div class="box" style="animation-name: to-none"></div></div>
  </div>
  <div class="row">
    <div class="cell"><div class="box" style="animation-name: orders"></div></div>
    <div class="cell"><div class="box" style="animation-name: matrix"></div></div>
    <div class="cell deep"><div class="box" style="animation-name: axes"></div></div>
    <div class="cell deep"><div class="box" style="animation-name: deep"></div></div>
    <div class="cell"><div class="box" style="animation-name: perspective"></div></div>
    <div class="cell"><div class="box early" style="animation-name: singular"></div></div>
    <div class="cell"><div class="box late" style="animation-name: singular"></div></div>
  </div>
  <div class="row">
    <div class="cell"><div class="box" style="animation-name: percent"></div></div>
    <div class="cell"><div class="box" style="animation-name: percent-matrix"></div></div>
    <div class="cell"><div class="box" style="animation-name: translate"></div></div>
    <div class="cell"><div class="box" style="animation-name: rotate"></div></div>
    <div class="cell"><div class="box" style="animation-name: scale"></div></div>
    <div class="cell"><div class="box" style="animation-name: all"></div></div>
  </div>
</body>
</html>
