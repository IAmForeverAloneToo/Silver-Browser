<!doctype html>
<html>
<head>
<title>Margin collapsing through nested boxes</title>
<style>
  html { background-color: #e7f0f3; }
  body { margin: 0; padding: 0 20px; }
  .through { margin-top: 30px; background-color: #9fc5d8; width: 500px; }
  .through .child { margin-top: 50px; height: 30px; background-color: #1f5f7a; }
  .padded { margin-top: 20px; padding-top: 10px; background-color: #9fc5d8; width: 500px; }
  .padded .child { margin-top: 40px; height: 30px; background-color: #1f5f7a; }
  .bordered { margin: 20px 0; border-top: 3px solid #0b3140; border-bottom: 3px solid #0b3140; width: 500px; }
  .bordered .child { margin: 25px 0; height: 30px; background-color: #1f5f7a; }
  .a { margin-bottom: 40px; height: 30px; width: 500px; background-color: #3c8dad; }
  .empty { margin: 60px 0; }
  .b { margin-top: 20px; height: 30px; width: 500px; background-color: #3c8dad; }
  .neg { margin-top: -10px; margin-bottom: 30px; height: 30px; width: 300px; background-color: #0b3140; }
  .last { margin-top: 15px; height: 30px; width: 500px; background-color: #9fc5d8; }
  .last .child { margin-bottom: 45px; height: 10px; background-color: #1f5f7a; }
  .tail { height: 20px; width: 500px; background-color: #3c8dad; }
</style>
</head>
<body>
  <div class="through"><div class="child"></div></div>
  <div class="padded"><div class="child"></div></div>
  <div class="bordered"><div class="child"></div></div>
  <div class="a"></div>
  <div class="empty"></div>
  <div class="b"></div>
  <div class="neg"></div>
  <div class="last"><div class="child"></div></div>
  <div class="tail"></div>
</body>
</html>
