<!doctype html>
<html>
<head>
<title>Rounded boxes: backgrounds and borders of every style along elliptical, percentage and overlapping radii (gap batch E)</title>
<meta name="reference-edge-tolerance" content="128">
<meta name="reference-tolerance" content="2">
<style>
  body { margin: 0; background: #fff; }
  div { position: absolute; box-sizing: border-box; }
  .a { left: 10px; top: 10px; width: 120px; height: 80px; border-radius: 16px; background: #3a7a4a; }
  .b { left: 150px; top: 10px; width: 120px; height: 80px; border-radius: 20px;
       border: 6px solid #2f3542; background: #e0d8c8; }
  .c { left: 290px; top: 10px; width: 120px; height: 80px; border-radius: 30px / 15px;
       border: 8px solid; border-color: #c03030 #3050c0 #30a050 #c0a030; }
  .d { left: 430px; top: 10px; width: 120px; height: 80px; border-radius: 50%; background: #89b4fa; }
  .e { left: 570px; top: 10px; width: 120px; height: 80px; border-radius: 200px; background: #a0522d; }
  .f { left: 10px; top: 110px; width: 120px; height: 80px; border-radius: 24px;
       border: 9px double #2f3542; }
  .g { left: 150px; top: 110px; width: 120px; height: 80px; border-radius: 24px;
       border: 10px groove #808080; }
  .h { left: 290px; top: 110px; width: 120px; height: 80px; border-radius: 4px 30px 10px 0;
       border: 4px solid #3050c0; background: #f6f2ea; }
  .i { left: 430px; top: 110px; width: 120px; height: 80px; border-radius: 20px;
       border: 12px solid rgba(0, 0, 0, 0.3); background: #ffcc00; background-clip: padding-box; }
  .j { left: 570px; top: 110px; width: 120px; height: 80px; border-radius: 30px;
       border-width: 2px 12px 20px 6px; border-style: solid; border-color: #c03030; }
  .k { left: 10px; top: 210px; width: 120px; height: 80px; border-radius: 16px;
       border: 10px outset #3a7a4a; }
  .l { left: 150px; top: 210px; width: 80px; height: 80px; border-radius: 50%;
       border: 10px solid #c03030; border-right-color: transparent; }
</style>
</head>
<body>
<div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div>
<div class="e"></div><div class="f"></div><div class="g"></div><div class="h"></div>
<div class="i"></div><div class="j"></div><div class="k"></div><div class="l"></div>
</body>
</html>
