<!doctype html>
<html>
<head>
<title>Fixed boxes against the viewport, in an unscrolled capture</title>
<style>
  html { background-color: #f3f0f7; }
  body { margin: 0; }
  .content { width: 300px; height: 400px; margin: 20px; background-color: #d9cfe6; }
  .content div { height: 60px; margin: 20px; background-color: #a58fc4; }
  .corner { position: fixed; right: 20px; bottom: 20px; width: 100px; height: 60px; background-color: #5a3e85; }
  .top { position: fixed; left: 50%; top: 10px; width: 80px; height: 30px; background-color: #3b2559; }
  .over { position: fixed; left: 150px; top: 120px; width: 240px; height: 40px; background-color: #ffffff; }
</style>
</head>
<body>
  <div class="content"><div></div><div></div><div></div></div>
  <div class="corner"></div>
  <div class="top"></div>
  <div class="over"></div>
</body>
</html>
