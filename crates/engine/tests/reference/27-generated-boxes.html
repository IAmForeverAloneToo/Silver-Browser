<!doctype html>
<html>
<head>
<title>Generated boxes: ::before and ::after as blocks, inline-blocks, floats and absolutely positioned boxes</title>
<style>
  html { background-color: #eef3f6; }
  body { margin: 0; }
  .blocks { width: 300px; margin: 20px; padding: 10px; background-color: #c9d9e3; }
  .blocks::before { content: ""; display: block; height: 20px; margin-bottom: 10px; background-color: #2f5d7a; }
  .blocks::after { content: ""; display: block; height: 30px; margin-top: 15px; border: 3px solid #1b3a4f; background-color: #6f9bb8; }
  .blocks div { height: 40px; background-color: #9dbcd0; }
  .inline { font-size: 0; width: 400px; margin: 20px; padding: 5px; background-color: #c9d9e3; }
  .inline::before { content: ""; display: inline-block; width: 50px; height: 30px; margin-right: 10px; background-color: #2f5d7a; }
  .inline::after { content: ""; display: inline-block; width: 80px; height: 50px; margin-left: 10px; border: 2px solid #1b3a4f; background-color: #6f9bb8; }
  .inline span { display: inline-block; width: 60px; height: 20px; background-color: #9dbcd0; }
  .floats { width: 400px; height: 80px; margin: 20px; background-color: #dde8ef; }
  .floats::before { content: ""; float: left; width: 70px; height: 50px; background-color: #2f5d7a; }
  .floats::after { content: ""; float: right; width: 90px; height: 60px; background-color: #6f9bb8; }
  .floats div { overflow: hidden; height: 30px; background-color: #9dbcd0; }
  .abs { position: relative; width: 300px; height: 100px; margin: 20px; background-color: #dde8ef; }
  .abs::before { content: ""; position: absolute; top: 10px; left: 20px; width: 60px; height: 40px; background-color: #2f5d7a; }
  .abs::after { content: ""; position: absolute; right: 10px; bottom: 15px; width: 80px; height: 30px; background-color: #6f9bb8; }
  .abs div { width: 100px; height: 20px; margin-left: 150px; background-color: #9dbcd0; }
</style>
</head>
<body>
  <div class="blocks"><div></div></div>
  <div class="inline"><span></span></div>
  <div class="floats"><div></div></div>
  <div class="abs"><div></div></div>
</body>
</html>
