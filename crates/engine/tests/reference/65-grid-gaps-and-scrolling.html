<!doctype html>
<html>
<head>
<title>Grid: percentage gaps against a definite size and against a height found by the rows, and grids and items that clip — overflowing rows and columns, an item that is a scroll container in a flexible track, content distribution that overflows</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .g { display: grid; margin: 8px 20px; background-color: #e6dcc8; }
  .g > div { background-color: #a07a3a; }
  .g > div:nth-child(2n) { background-color: #c8a46a; }
  .g > div:nth-child(3n) { background-color: #604a20; }
  .col { float: left; width: 400px; }
  i { display: block; background-color: #3a5a7a; }
  .a { width: 300px; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 20px; column-gap: 10%; row-gap: 4px; }
  .b { width: 300px; height: 100px; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20% 5%; }
  .c { width: 300px; grid-template-columns: 1fr 1fr; grid-template-rows: 30px 30px; row-gap: 25%; }
  .d { width: 300px; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 20px; gap: 10px 10%; padding: 10px 40px; box-sizing: border-box; }
  .h { overflow: hidden; }
  .e { width: 300px; height: 60px; grid-template-columns: 120px 120px 120px; grid-auto-rows: 40px; gap: 6px; }
  .f { width: 300px; height: 60px; grid-template-columns: 120px 120px 120px; grid-auto-rows: 40px; gap: 6px; justify-content: end; align-content: center; }
  .k { width: 300px; grid-template-columns: 1fr 1fr; gap: 10px; }
  .k > div { height: 40px; padding: 4px; }
  .m { width: 300px; height: 60px; grid-template-columns: 1fr 100px; padding: 8px; border: 4px solid #604a20; }
</style>
</head>
<body>
  <div class="col">
    <div class="g a"><div></div><div></div><div></div><div></div><div></div><div></div></div>
    <div class="g b"><div></div><div></div><div></div><div></div></div>
    <div class="g c"><div></div><div></div><div></div><div></div></div>
    <div class="g d"><div></div><div></div><div></div><div></div></div>
  </div>
  <div class="col">
    <div class="g e h"><div></div><div></div><div></div><div></div><div></div><div></div></div>
    <div class="g f h"><div></div><div></div><div></div><div></div><div></div><div></div></div>
    <div class="g k"><div class="h"><i style="width: 200px; height: 60px"></i></div><div><i style="width: 60px; height: 20px"></i></div></div>
    <div class="g k" style="grid-template-columns: minmax(0, 1fr) 1fr"><div style="min-width: 0"><i style="width: 200px; height: 30px"></i></div><div><i style="width: 60px; height: 20px"></i></div></div>
    <div class="g m h"><div><i style="width: 260px; height: 90px"></i></div><div></div></div>
  </div>
</body>
</html>
