<!doctype html>
<html>
<head>
<meta name="reference-tolerance" content="1">
<meta name="reference-edge-tolerance" content="80">
<title>SVG (M32): strokes, their widths, the three caps and the three joins, a miter limit cutting a sharp join, dashes with an offset and in percentages, stroke-opacity over a fill, paint-order with the stroke first, and a stroke in a scaled group; no text</title>
<style>
  html { background-color: #eef0f3; }
  body { margin: 10px; }
  svg { display: block; float: left; margin: 0 10px 10px 0; background-color: #ffffff; }
</style>
</head>
<body>
<svg width="180" height="120">
  <line x1="30" y1="20" x2="150" y2="20" stroke="#2f4f6f" stroke-width="14" stroke-linecap="butt"/>
  <line x1="30" y1="55" x2="150" y2="55" stroke="#2f4f6f" stroke-width="14" stroke-linecap="round"/>
  <line x1="30" y1="90" x2="150" y2="90" stroke="#2f4f6f" stroke-width="14" stroke-linecap="square"/>
  <line x1="30" y1="5" x2="30" y2="110" stroke="#8f3f2f" stroke-width="1"/>
  <line x1="150" y1="5" x2="150" y2="110" stroke="#8f3f2f" stroke-width="1"/>
</svg>
<svg width="180" height="120">
  <polyline points="15,50 45,15 75,50" fill="none" stroke="#5f7f9f" stroke-width="12" stroke-linejoin="miter"/>
  <polyline points="65,105 95,70 125,105" fill="none" stroke="#5f7f9f" stroke-width="12" stroke-linejoin="round"/>
  <polyline points="105,50 135,15 165,50" fill="none" stroke="#5f7f9f" stroke-width="12" stroke-linejoin="bevel"/>
</svg>
<svg width="180" height="120">
  <polyline points="20,100 40,20 60,100" fill="none" stroke="#2f4f6f" stroke-width="10" stroke-miterlimit="10"/>
  <polyline points="80,100 100,20 120,100" fill="none" stroke="#2f4f6f" stroke-width="10" stroke-miterlimit="2"/>
  <polyline points="135,100 150,20 165,100" fill="none" stroke="#8f3f2f" stroke-width="6" stroke-miterlimit="1"/>
</svg>
<svg width="180" height="120">
  <line x1="10" y1="15" x2="170" y2="15" stroke="#2f4f6f" stroke-width="6" stroke-dasharray="20 10"/>
  <line x1="10" y1="35" x2="170" y2="35" stroke="#2f4f6f" stroke-width="6" stroke-dasharray="20 10" stroke-dashoffset="15"/>
  <line x1="10" y1="55" x2="170" y2="55" stroke="#5f7f9f" stroke-width="6" stroke-dasharray="5 5 15"/>
  <line x1="10" y1="75" x2="170" y2="75" stroke="#8f3f2f" stroke-width="8" stroke-dasharray="0 16" stroke-linecap="round"/>
  <rect x="20" y="88" width="140" height="24" fill="none" stroke="#7f9fbf" stroke-width="4" stroke-dasharray="10%"/>
</svg>
<svg width="180" height="120">
  <rect x="15" y="15" width="70" height="90" fill="#7f9fbf" stroke="#2f4f6f" stroke-width="16" stroke-opacity="0.5"/>
  <rect x="105" y="15" width="60" height="40" fill="#7f9fbf" stroke="#2f4f6f" stroke-width="12" paint-order="stroke"/>
  <rect x="105" y="70" width="60" height="40" fill="#7f9fbf" stroke="#2f4f6f" stroke-width="12"/>
</svg>
<svg width="180" height="120">
  <g transform="scale(3 1.5)">
    <circle cx="20" cy="40" r="15" fill="none" stroke="#8f3f2f" stroke-width="3"/>
  </g>
  <g transform="translate(100 10) scale(2)">
    <path d="M5 5 L30 5 L17 40 Z" fill="none" stroke="#2f4f6f" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
</body>
</html>
