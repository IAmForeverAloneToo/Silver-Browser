<!doctype html>
<html>
<head>
<meta name="reference-size" content="640x480">
<title>Breakpoints at 640 by 480 pixels in min-, max- and range syntax, with em and lists, the viewport on them: each cell coloured by the query it answers</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  .c { float: left; width: 50px; height: 50px; margin: 10px 0 0 10px; background-color: #b8b0a0; }
  @media (min-width: 640px) { .c1 { background-color: #3a7a4a; } }
  @media (max-width: 640px) { .c2 { background-color: #3a5a7a; } }
  @media (width > 640px) { .c3 { background-color: #a0522d; } }
  @media (width >= 640px) { .c4 { background-color: #6a4a8a; } }
  @media (width < 640px) { .c5 { background-color: #2a8a8a; } }
  @media (width <= 640px) { .c6 { background-color: #8a6a2a; } }
  @media (width = 640px) { .c7 { background-color: #4a6a2a; } }
  @media (600px < width <= 640px) { .c8 { background-color: #8a3a5a; } }
  @media (640px <= width < 700px) { .c9 { background-color: #3a7a4a; } }
  @media (640px > width) { .c10 { background-color: #3a5a7a; } }
  @media (min-height: 480px) { .c11 { background-color: #a0522d; } }
  @media (max-height: 480px) { .c12 { background-color: #6a4a8a; } }
  @media (height > 480px) { .c13 { background-color: #2a8a8a; } }
  @media (480px >= height) { .c14 { background-color: #8a6a2a; } }
  @media (min-width: 40em) { .c15 { background-color: #4a6a2a; } }
  @media (max-width: 39.9375em) { .c16 { background-color: #8a3a5a; } }
  @media (min-width: 640px) and (min-height: 480px) { .c17 { background-color: #3a7a4a; } }
  @media (min-width: 640px), (min-height: 480px) { .c18 { background-color: #3a5a7a; } }
  @media not all and (min-width: 640px) { .c19 { background-color: #a0522d; } }
  @media (width: 640px) { .c20 { background-color: #6a4a8a; } }
</style>
</head>
<body>
  <div class="c c1"></div>
  <div class="c c2"></div>
  <div class="c c3"></div>
  <div class="c c4"></div>
  <div class="c c5"></div>
  <div class="c c6"></div>
  <div class="c c7"></div>
  <div class="c c8"></div>
  <div class="c c9"></div>
  <div class="c c10"></div>
  <div class="c c11"></div>
  <div class="c c12"></div>
  <div class="c c13"></div>
  <div class="c c14"></div>
  <div class="c c15"></div>
  <div class="c c16"></div>
  <div class="c c17"></div>
  <div class="c c18"></div>
  <div class="c c19"></div>
  <div class="c c20"></div>
</body>
</html>
