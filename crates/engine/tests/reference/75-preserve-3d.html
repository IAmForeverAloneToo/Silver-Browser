<!doctype html>
<html>
<head>
<meta name="reference-tolerance" content="1">
<meta name="reference-edge-tolerance" content="128">
<title>Transforms: 3D rendering contexts — two planes at different depths under a turned root, two planes turned apart, a flat child flattening its own child, and a context whose root is also the perspective, painted by depth</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .s { float: left; position: relative; width: 240px; height: 200px; margin: 20px 0 0 20px; background-color: #e6dcc8; perspective: 600px; }
  .c { position: absolute; left: 40px; top: 40px; width: 160px; height: 120px; transform-style: preserve-3d; }
  .a { position: absolute; left: 0; top: 0; width: 100px; height: 70px; background-color: #a07a3a; }
  .b { position: absolute; left: 50px; top: 40px; width: 100px; height: 70px; background-color: #3a5a7a; }
</style>
</head>
<body>
  <div class="s"><div class="c" style="transform: rotateY(25deg)"><div class="a" style="transform: translateZ(60px)"></div><div class="b" style="transform: translateZ(-60px)"></div></div></div>
  <div class="s"><div class="c" style="transform: rotateY(25deg)"><div class="a" style="transform: translateZ(-60px)"></div><div class="b" style="transform: translateZ(60px)"></div></div></div>
  <div class="s"><div class="c"><div class="a" style="transform: rotateX(50deg); top: 0"></div><div class="b" style="transform: rotateX(-50deg); top: 60px; left: 30px"></div></div></div>
  <div class="s"><div class="c" style="transform: rotateX(30deg)"><div class="a" style="transform: translateZ(40px)"></div><div class="b" style="transform-style: flat; transform: translateZ(-40px)"><div class="a" style="left: 20px; top: 10px; width: 60px; height: 40px; background-color: #d98c8c; transform: translateZ(200px)"></div></div></div></div>
  <div class="s" style="perspective: none"><div class="c" style="transform: rotateY(-30deg); perspective: 300px"><div class="a" style="transform: translateZ(50px)"></div><div class="b" style="transform: rotateY(40deg) translateZ(-20px)"></div></div></div>
  <div class="s"><div class="c" style="transform: rotateY(25deg)"><div class="a" style="transform: translateZ(60px); opacity: 0.6"></div><div class="b" style="transform: translateZ(-60px)"></div></div></div>
</body>
</html>
