<!doctype html>
<html>
<head>
<title>@supports with declarations, not, and, or and selector(), unknown properties, values and functions, a malformed condition, and nested in @media and around it</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  .c { float: left; width: 50px; height: 50px; margin: 10px 0 0 10px; background-color: #b8b0a0; }
  @supports (display: grid) { .c1 { background-color: #3a7a4a; } }
  @supports (display: foo) { .c2 { background-color: #3a5a7a; } }
  @supports not (display: foo) { .c3 { background-color: #a0522d; } }
  @supports (display: flex) and (color: red) { .c4 { background-color: #6a4a8a; } }
  @supports (display: foo) or (color: red) { .c5 { background-color: #2a8a8a; } }
  @supports (display: foo) and (color: red) { .c6 { background-color: #8a6a2a; } }
  @supports ((display: grid) and (not (display: foo))) { .c7 { background-color: #4a6a2a; } }
  @supports selector(.a > .b) { .c8 { background-color: #8a3a5a; } }
  @supports selector(:foo) { .c9 { background-color: #3a7a4a; } }
  @supports not selector(:foo) { .c10 { background-color: #3a5a7a; } }
  @supports selector(a, b) { .c11 { background-color: #a0522d; } }
  @supports (foo: bar) { .c12 { background-color: #6a4a8a; } }
  @supports (transform: rotate(10deg)) { .c13 { background-color: #2a8a8a; } }
  @supports (color: red !important) { .c14 { background-color: #8a6a2a; } }
  @supports (display:grid) { .c15 { background-color: #4a6a2a; } }
  @supports display: grid { .c16 { background-color: #8a3a5a; } }
  @supports (unknown-fn()) { .c17 { background-color: #3a7a4a; } }
  @media (min-width: 100px) { @supports (display: grid) { .c18 { background-color: #3a5a7a; } } }
  @supports (display: grid) { @media print { .c19 { background-color: #a0522d; } } }
</style>
</head>
<body>
  <div class="c c1"></div>
  <div class="c c2"></div>
  <div class="c c3"></div>
  <div class="c c4"></div>
  <div class="c c5"></div>
  <div class="c c6"></div>
  <div class="c c7"></div>
  <div class="c c8"></div>
  <div class="c c9"></div>
  <div class="c c10"></div>
  <div class="c c11"></div>
  <div class="c c12"></div>
  <div class="c c13"></div>
  <div class="c c14"></div>
  <div class="c c15"></div>
  <div class="c c16"></div>
  <div class="c c17"></div>
  <div class="c c18"></div>
  <div class="c c19"></div>
</body>
</html>
