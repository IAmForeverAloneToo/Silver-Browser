<!doctype html>
<html>
<head>
<title>Image formats: PNG, a GIF's first frame, JPEG and WebP, and a JPEG turned by its EXIF orientation, unless image-orientation says none</title>
<meta name="reference-load" content="file">
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  img { position: absolute; image-rendering: pixelated; }
</style>
</head>
<body>
  <img src="images/quad.png" style="left: 10px; top: 10px">
  <img src="images/anim.gif" style="left: 40px; top: 10px">
  <img src="images/red-blue.jpg" style="left: 60px; top: 10px">
  <img src="images/red-blue.webp" style="left: 90px; top: 10px">
  <!-- 16 by 8, turned a quarter clockwise by its orientation. -->
  <img src="images/turned.jpg" style="left: 120px; top: 10px">
  <img src="images/turned.jpg" style="left: 140px; top: 10px; image-orientation: none">
  <img src="images/turned.jpg" style="left: 170px; top: 10px; width: 32px">
  <img src="images/quad.png" style="left: 10px; top: 60px; width: 80px">
  <img src="images/anim.gif" style="left: 100px; top: 60px; width: 40px">
  <img src="images/red-blue.jpg" style="left: 150px; top: 60px; width: 64px">
  <img src="images/red-blue.webp" style="left: 230px; top: 60px; width: 64px">
  <img src="images/turned.jpg" style="left: 310px; top: 60px; width: 32px; image-orientation: none">
</body>
</html>
