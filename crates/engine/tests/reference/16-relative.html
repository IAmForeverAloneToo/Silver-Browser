<!doctype html>
<html>
<head>
<title>Relative offsets: the box moves, its siblings stay</title>
<style>
  html { background-color: #eef2f8; }
  body { margin: 0; }
  .box { width: 400px; margin: 20px; padding: 10px; background-color: #e8eef7; }
  .a, .b, .c { height: 40px; margin: 10px 0; background-color: #4f6d9a; }
  .b { position: relative; left: 30px; top: 15px; background-color: #9ab0d0; }
  .c { position: relative; right: 20px; bottom: 5px; background-color: #6e8bb5; }
  .row { font-size: 0; margin: 10px 0 0; }
  .row span { display: inline-block; width: 50px; height: 30px; margin: 0 5px; background-color: #4f6d9a; }
  .row .r { position: relative; top: 10px; left: 10px; background-color: #c2d0e6; }
  .pct { position: relative; left: 25%; width: 100px; height: 20px; margin: 20px 0 0; background-color: #9ab0d0; }
</style>
</head>
<body>
  <div class="box">
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="row"><span></span><span class="r"></span><span></span></div>
    <div class="pct"></div>
  </div>
</body>
</html>
