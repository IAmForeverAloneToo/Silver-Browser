<!doctype html>
<html>
<head>
<meta name="reference-scripts" content="on">
<title>WebAssembly (M29): a module compiled from its bytes and instantiated, its exports called with numbers, its memory written and read by the page's script, its import calling the page back, its global, table, trap, BigInt and float; each puts boxes in a row, their widths what the module computed</title>
<style>
  html { background-color: #eef0f3; }
  body { margin: 10px; }
  .row { overflow: hidden; margin-bottom: 10px; padding: 4px; background-color: #c8d0d8; height: 40px; }
  .b { float: left; height: 32px; margin: 4px; background-color: #2f4f6f; }
  .no { background-color: #8f3f2f; }
</style>
</head>
<body>
<div class="row" id="add"></div>
<div class="row" id="memory"></div>
<div class="row" id="imports"></div>
<div class="row" id="table"></div>
<div class="row" id="trap"></div>
<div class="row" id="numbers"></div>
<div class="row" id="grow"></div>
<script>
  var rows = ['add', 'memory', 'imports', 'table', 'trap', 'numbers', 'grow'];
  var put = function (row, width, no) {
    var b = document.createElement('div');
    b.className = no ? 'b no' : 'b';
    b.style.width = width + 'px';
    document.getElementById(row).appendChild(b);
  };
  // The module's bytes, made from this text by the `wat` crate:
  //   (module
  //     (import "page" "box" (func $box (param i32 i32)))
  //     (memory (export "mem") 1 2)
  //     (global $scale (export "scale") (mut i32) (i32.const 2))
  //     (table (export "t") 2 funcref)
  //     (elem (i32.const 0) func $double $square)
  //     (type $un (func (param i32) (result i32)))
  //     (func $double (param i32) (result i32) local.get 0 i32.const 2 i32.mul)
  //     (func $square (param i32) (result i32) local.get 0 local.get 0 i32.mul)
  //     (func (export "add") (param i32 i32) (result i32) local.get 0 local.get 1 i32.add)
  //     (func (export "pick") (param i32 i32) (result i32) local.get 1 local.get 0 call_indirect (type $un))
  //     (func (export "sum") (param i32) (result i32) (local i32 i32)
  //       (block (loop
  //         local.get 1 local.get 0 i32.ge_u br_if 1
  //         local.get 2 local.get 1 i32.const 4 i32.mul i32.load i32.add local.set 2
  //         local.get 1 i32.const 1 i32.add local.set 1
  //         br 0))
  //       local.get 2)
  //     (func (export "fill") (param i32 i32) (local i32)
  //       (block (loop
  //         local.get 2 local.get 0 i32.ge_u br_if 1
  //         i32.const 64 local.get 2 i32.const 4 i32.mul i32.add
  //         local.get 2 i32.const 1 i32.add local.get 1 i32.mul i32.store
  //         local.get 2 i32.const 1 i32.add local.set 2
  //         br 0)))
  //     (func (export "draw") (param i32 i32) (local i32)
  //       (block (loop
  //         local.get 2 local.get 1 i32.ge_u br_if 1
  //         local.get 0
  //         local.get 2 i32.const 1 i32.add i32.const 8 i32.mul global.get $scale i32.mul
  //         call $box
  //         local.get 2 i32.const 1 i32.add local.set 2
  //         br 0)))
  //     (func (export "share") (param i32) (result i32) i32.const 100 local.get 0 i32.div_u)
  //     (func (export "triple") (param i64) (result i64) local.get 0 i64.const 3 i64.mul)
  //     (func (export "single") (param f32) (result f32) local.get 0))
  var bytes = new Uint8Array([
    0,97,115,109,1,0,0,0,1,27,5,96,1,127,1,127,96,2,127,127,0,96,2,127,127,
    1,127,96,1,126,1,126,96,1,125,1,125,2,12,1,4,112,97,103,101,3,98,111,
    120,0,1,3,11,10,0,0,2,2,0,1,1,0,3,4,4,4,1,112,0,2,5,4,1,1,1,2,6,6,1,127,
    1,65,2,11,7,78,11,3,109,101,109,2,0,5,115,99,97,108,101,3,0,1,116,1,0,3,
    97,100,100,0,3,4,112,105,99,107,0,4,3,115,117,109,0,5,4,102,105,108,108,
    0,6,4,100,114,97,119,0,7,5,115,104,97,114,101,0,8,6,116,114,105,112,108,
    101,0,9,6,115,105,110,103,108,101,0,10,9,8,1,0,65,0,11,2,1,2,10,188,1,
    10,7,0,32,0,65,2,108,11,7,0,32,0,32,0,108,11,7,0,32,0,32,1,106,11,9,0,
    32,1,32,0,17,0,0,11,41,1,2,127,2,64,3,64,32,1,32,0,79,13,1,32,2,32,1,65,
    4,108,40,2,0,106,33,2,32,1,65,1,106,33,1,12,0,11,11,32,2,11,46,1,1,127,
    2,64,3,64,32,2,32,0,79,13,1,65,192,0,32,2,65,4,108,106,32,2,65,1,106,32,
    1,108,54,2,0,32,2,65,1,106,33,2,12,0,11,11,11,41,1,1,127,2,64,3,64,32,2,
    32,1,79,13,1,32,0,32,2,65,1,106,65,8,108,35,0,108,16,0,32,2,65,1,106,33,
    2,12,0,11,11,11,8,0,65,228,0,32,0,110,11,7,0,32,0,66,3,126,11,4,0,32,0,
    11,0,46,4,110,97,109,101,1,22,3,0,3,98,111,120,1,6,100,111,117,98,108,
    101,2,6,115,113,117,97,114,101,4,5,1,0,2,117,110,7,8,1,0,5,115,99,97,
    108,101,
  ]);
  var e = new WebAssembly.Instance(new WebAssembly.Module(bytes), {
    page: { box: function (row, width) { put(rows[row], width); } }
  }).exports;
  // Numbers in, numbers out.
  put('add', e.add(20, 10));
  put('add', e.add(15, 25));
  put('add', e.add(2.9, '8'));
  // The page writes four numbers the module sums; the module writes
  // three the page reads.
  var view = new Int32Array(e.mem.buffer);
  view[0] = 10; view[1] = 20; view[2] = 30; view[3] = 5;
  put('memory', e.sum(4));
  e.fill(3, 12);
  put('memory', view[16]);
  put('memory', view[17]);
  put('memory', view[18]);
  // The module calls the page for each box, scaled by its global, which
  // the page then changes.
  e.draw(2, 3);
  e.scale.value = 3;
  e.draw(2, 2);
  // The table's functions, called by index, and one of them read out.
  put('table', e.pick(0, 15));
  put('table', e.pick(1, 6));
  put('table', e.t.get(1)(5));
  put('table', e.t.length * 7, true);
  // A trap is a RuntimeError the page catches; the module goes on.
  try {
    e.share(0);
    put('trap', 90);
  } catch (error) {
    put('trap', error instanceof WebAssembly.RuntimeError ? 14 : 90, true);
  }
  put('trap', e.share(4));
  // An i64 is a BigInt; an f32 comes back rounded to single precision.
  put('numbers', Number(e.triple(7n)));
  put('numbers', Math.round((e.single(0.1) - 0.1) * 1e10));
  try {
    e.triple(7);
    put('numbers', 90);
  } catch (error) {
    put('numbers', error instanceof TypeError ? 12 : 90, true);
  }
  // Growing the memory detaches the buffer the page held.
  var old = e.mem.buffer;
  put('grow', e.mem.grow(1) * 20);
  put('grow', old.byteLength + 6, true);
  put('grow', e.mem.buffer.byteLength / 4096);
</script>
</body>
</html>
