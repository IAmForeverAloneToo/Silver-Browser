<!doctype html>
<html>
<head>
<title>Gradients: linear by side, corner and angle, radial by shape and extent, repeating, with hard stops and hints</title>
<!-- The reference browser's ramps are its own rasterizer's, which
     rounds a channel otherwise: a channel may differ by up to 2. -->
<meta name="reference-tolerance" content="2">
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  div { position: absolute; width: 140px; height: 60px; }
</style>
</head>
<body>
  <div style="left: 10px; top: 10px; background: linear-gradient(to right, #d02020, #2040d0)"></div>
  <div style="left: 160px; top: 10px; background: linear-gradient(#20a040, #e0c020)"></div>
  <div style="left: 310px; top: 10px; background: linear-gradient(45deg, #d02020, #2040d0)"></div>
  <div style="left: 460px; top: 10px; background: linear-gradient(to bottom right, #20a040, #2040d0)"></div>
  <div style="left: 610px; top: 10px; background: linear-gradient(to right, #d02020 30%, #2040d0 30%, #2040d0 60%, #e0c020 60%)"></div>

  <div style="left: 10px; top: 90px; background: linear-gradient(to right, #d02020, 25%, #2040d0)"></div>
  <div style="left: 160px; top: 90px; background: linear-gradient(to right, #d02020 20px, #20a040, #2040d0 120px)"></div>
  <div style="left: 310px; top: 90px; background: repeating-linear-gradient(to right, #d02020 0 10px, #2040d0 10px 20px)"></div>
  <div style="left: 460px; top: 90px; background: repeating-linear-gradient(to right, #20a040, #e0c020 35px)"></div>
  <div style="left: 610px; top: 90px; background: linear-gradient(to right, #d0202000, #2040d0)"></div>

  <div style="left: 10px; top: 170px; background: radial-gradient(#d02020, #2040d0)"></div>
  <div style="left: 160px; top: 170px; background: radial-gradient(circle, #d02020, #2040d0)"></div>
  <div style="left: 310px; top: 170px; background: radial-gradient(circle closest-side, #20a040, #e0c020)"></div>
  <div style="left: 460px; top: 170px; background: radial-gradient(ellipse farthest-side at 20px 20px, #20a040, #2040d0)"></div>
  <div style="left: 610px; top: 170px; background: radial-gradient(circle 20px, #d02020 50%, #2040d0 50%)"></div>

  <div style="left: 10px; top: 250px; background: repeating-radial-gradient(circle, #d02020 0 6px, #e0c020 6px 12px)"></div>
  <div style="left: 160px; top: 250px; background: radial-gradient(30px 20px at 70px 30px, #2040d0, #f6f2ea)"></div>
  <div style="left: 310px; top: 250px; background: linear-gradient(to right, #d02020, #2040d0) 0 0 / 40px 30px"></div>
  <div style="left: 460px; top: 250px; background: radial-gradient(circle closest-corner at 0 0, #20a040, #2040d0)"></div>
  <div style="left: 610px; top: 250px; background: linear-gradient(200deg, #e0c020, #d02020 40%, #2040d0)"></div>
</body>
</html>
