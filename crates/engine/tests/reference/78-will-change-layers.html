<!doctype html>
<html>
<head>
<meta name="reference-tolerance" content="1">
<title>Layers: boxes whose will-change names transform, opacity, perspective or transform-style, alone, translated, with borders, children, a clip and nested in one another, each beside the same box drawn through, which it must look no different from</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .pair { float: left; width: 340px; height: 100px; margin: 8px 0 0 40px; }
  .b { float: left; width: 120px; height: 80px; margin: 10px 30px 0 0; background-color: #c8a46a; border: 4px solid #604a20; }
  .k { width: 50px; height: 30px; margin: 10px; background-color: #3a5a7a; }
</style>
</head>
<body>
  <div class="pair"><div class="b" style="will-change: transform"></div><div class="b"></div></div>
  <div class="pair"><div class="b" style="will-change: opacity"><div class="k"></div></div><div class="b"><div class="k"></div></div></div>
  <div class="pair"><div class="b" style="will-change: transform; transform: translate(20px, 10px)"></div><div class="b" style="transform: translate(20px, 10px)"></div></div>
  <div class="pair"><div class="b" style="will-change: perspective; overflow: hidden"><div class="k" style="width: 200px"></div></div><div class="b" style="overflow: hidden"><div class="k" style="width: 200px"></div></div></div>
  <div class="pair"><div class="b" style="will-change: transform-style"><div class="k" style="will-change: transform"></div></div><div class="b"><div class="k"></div></div></div>
  <div class="pair"><div class="b" style="will-change: transform; opacity: 0.5"></div><div class="b" style="opacity: 0.5"></div></div>
  <div class="pair"><div class="b" style="will-change: scale; transform: scale(1.5)"></div><div class="b" style="transform: scale(1.5)"></div></div>
  <div class="pair"><div class="b" style="will-change: transform; border-top-color: #d98c8c; border-left-color: #3a5a7a"></div><div class="b" style="border-top-color: #d98c8c; border-left-color: #3a5a7a"></div></div>
  <div class="pair"><div class="b" style="will-change: transform; transform: rotate(90deg)"></div><div class="b" style="transform: rotate(90deg)"></div></div>
  <div class="pair"><div class="b" style="will-change: contents"></div><div class="b"></div></div>
</body>
</html>
