<!doctype html>
<html>
<head>
<meta name="reference-size" content="480x640">
<title>Orientation and aspect ratio in a portrait viewport of 480 by 640 pixels: ratios exact, reduced and as a number, in min-, max- and range syntax and in a boolean context</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  .c { float: left; width: 50px; height: 50px; margin: 10px 0 0 10px; background-color: #b8b0a0; }
  @media (orientation: portrait) { .c1 { background-color: #3a7a4a; } }
  @media (orientation: landscape) { .c2 { background-color: #3a5a7a; } }
  @media (aspect-ratio: 3/4) { .c3 { background-color: #a0522d; } }
  @media (aspect-ratio: 3 / 4) { .c4 { background-color: #6a4a8a; } }
  @media (aspect-ratio: 0.75) { .c5 { background-color: #2a8a8a; } }
  @media (min-aspect-ratio: 1/1) { .c6 { background-color: #8a6a2a; } }
  @media (max-aspect-ratio: 1/1) { .c7 { background-color: #4a6a2a; } }
  @media (aspect-ratio < 1) { .c8 { background-color: #8a3a5a; } }
  @media (aspect-ratio > 2/3) { .c9 { background-color: #3a7a4a; } }
  @media (1/2 < aspect-ratio < 1) { .c10 { background-color: #3a5a7a; } }
  @media (aspect-ratio: 6/8) { .c11 { background-color: #a0522d; } }
  @media (min-aspect-ratio: 4/3) { .c12 { background-color: #6a4a8a; } }
  @media (orientation) { .c13 { background-color: #2a8a8a; } }
  @media (aspect-ratio) { .c14 { background-color: #8a6a2a; } }
  @media (orientation: portrait) and (max-aspect-ratio: 3/4) { .c15 { background-color: #4a6a2a; } }
  @media (aspect-ratio: 3/4.0) { .c16 { background-color: #8a3a5a; } }
</style>
</head>
<body>
  <div class="c c1"></div>
  <div class="c c2"></div>
  <div class="c c3"></div>
  <div class="c c4"></div>
  <div class="c c5"></div>
  <div class="c c6"></div>
  <div class="c c7"></div>
  <div class="c c8"></div>
  <div class="c c9"></div>
  <div class="c c10"></div>
  <div class="c c11"></div>
  <div class="c c12"></div>
  <div class="c c13"></div>
  <div class="c c14"></div>
  <div class="c c15"></div>
  <div class="c c16"></div>
</body>
</html>
