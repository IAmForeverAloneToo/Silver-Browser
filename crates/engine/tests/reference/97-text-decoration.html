<!doctype html>
<html>
<head>
<title>Text decoration: underlines, overlines and line-throughs, solid and double, of each thickness rule and underline position, propagated through inline and block boxes and across the spaces their elements hold; the text transparent and with no descenders, so that only the lines are compared</title>
<style>
  /* The reference browser is given the engine's own font, whose
     metrics place the lines. */
  @font-face { font-family: "Reference Sans"; src: url(../../../text/fonts/DejaVuSans.ttf); }
  html { background-color: #f6f2ea; font-family: "Reference Sans"; font-size: 16px; }
  body { margin: 0; }
  div { float: left; width: 180px; height: 40px; margin: 10px 0 0 10px; background-color: #e0d8c8; color: transparent; text-decoration-color: #2f4f7f; }
  .big { font-size: 32px; height: 56px; }

  .u { text-decoration-line: underline; }
  .o { text-decoration-line: overline; }
  .t { text-decoration-line: line-through; }
  .uot { text-decoration-line: underline overline line-through; }
  .double { text-decoration-style: double; }
  .thick { text-decoration-thickness: 3px; }
  .rounded { text-decoration-thickness: 2.3px; }
  .percent { text-decoration-thickness: 15%; }
  .font { text-decoration-thickness: from-font; }
  .under { text-underline-position: under; }
  .from-font { text-underline-position: from-font; }
  .offset { text-underline-offset: 5px; }
  .em-offset { text-underline-offset: 0.3em; }

  /* An inline element's own line inside its block's, each with its
     font and colour; the block's across the span's larger text. */
  .nested { text-decoration: underline #2f4f7f; }
  .nested span { font-size: 28px; text-decoration: overline #3a7a4a; }

  /* A block's decoration on the text of a block inside it, drawn with
     that block's font. */
  .outer { text-decoration: underline #a0522d; font-size: 40px; height: 64px; }
  .outer p { margin: 0; font-size: 20px; }

  /* The lines reach across the spaces the decorating element holds, and
     no further. */
  .spaces { text-decoration: none; }
  .spaces span { text-decoration: underline #3a7a4a; }
</style>
</head>
<body>
  <div class="u">xxxxxxxx</div>
  <div class="o">xxxxxxxx</div>
  <div class="t">xxxxxxxx</div>
  <div class="uot double">xxxxxxxx</div>
  <div class="u big">xxxxxx</div>
  <div class="uot big double">xxxxxx</div>
  <div class="u thick">xxxxxxxx</div>
  <div class="u rounded double">xxxxxxxx</div>
  <div class="t percent big">xxxxxx</div>
  <div class="u font">xxxxxxxx</div>
  <div class="u under">xxxxxxxx</div>
  <div class="u from-font big">xxxxxx</div>
  <div class="u offset">xxxxxxxx</div>
  <div class="u em-offset big">xxxxxx</div>
  <div class="nested">xxx <span>xx</span> xx</div>
  <div class="outer"><p>xxxx xxxx</p></div>
  <div class="spaces">xx <span>xxx xx </span> xxx</div>
</body>
</html>
