<!doctype html>
<html>
<head>
<title>Animated values of each type at three points: lengths, percentages and lengths mixed, integers, numbers, colours through transparency, and an easing's overshoot clamped to each property's range</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; }
  .row { display: flex; margin: 10px 0 0 10px; }
  .cell { position: relative; width: 120px; height: 40px; margin-right: 10px; background-color: #e0d8c8; }
  .bar { height: 40px; background-color: #3a7a4a; }
  /* Paused, each a second long and linear unless it says otherwise: a
     delay of -0.25s, -0.5s or -0.75s holds it a quarter, half or three
     quarters of the way. */
  .a { animation-duration: 1s; animation-timing-function: linear; animation-play-state: paused; }
  .p1 { animation-delay: -0.25s; }
  .p2 { animation-delay: -0.5s; }
  .p3 { animation-delay: -0.75s; }

  /* Lengths: 20px to 100px. */
  @keyframes length { from { width: 20px; } to { width: 100px; } }
  .length { animation-name: length; }

  /* A percentage to a length: 10% of the cell's 120px to 100px. */
  @keyframes mixed { from { width: 10%; } to { width: 100px; } }
  .mixed { animation-name: mixed; }

  /* A length to a calc() with a percentage, and a negative length. */
  @keyframes calc { from { width: calc(50% - 20px); margin-left: -20px; } to { width: calc(20% + 40px); margin-left: 20px; } }
  .calc { animation-name: calc; }

  /* Integers: an order from 0 to 3, rounded half up, puts the green
     item among the grey ones; a z-index from 0 to 4 puts it over the
     brown box at 2 and more. */
  .flex { display: flex; }
  .flex div { width: 30px; height: 40px; background-color: #8a8a8a; }
  .flex .g { background-color: #3a7a4a; }
  .flex .o1 { order: 1; } .flex .o2 { order: 2; } .flex .o3 { order: 3; }
  @keyframes order { from { order: 0; } to { order: 3; } }
  .order { animation-name: order; }
  .stack div { position: absolute; top: 0; width: 60px; height: 40px; }
  .stack .under { left: 0; background-color: #3a7a4a; z-index: 0; }
  .stack .over { left: 30px; background-color: #a0522d; z-index: 1; }
  @keyframes z { from { z-index: 0; } to { z-index: 4; } }
  .z { animation-name: z; }

  /* Numbers: a flex-grow from 0 to 4 against a grey item's 1. */
  .grow div { flex-grow: 1; height: 40px; background-color: #8a8a8a; }
  .grow .g { flex-grow: 0; background-color: #3a7a4a; }
  @keyframes grow { from { flex-grow: 0; } to { flex-grow: 4; } }
  .growing { animation-name: grow; }

  /* Colours: red to blue, transparent to blue and red to transparent,
     interpolated premultiplied, over a grey of 100. */
  .cell.backdrop { background-color: #646464; }
  @keyframes colour { from { background-color: #c80000; } to { background-color: #0000c8; } }
  .colour { animation-name: colour; }
  @keyframes appear { from { background-color: transparent; } to { background-color: #0000c8; } }
  .appear { animation-name: appear; }
  @keyframes fade { from { background-color: #c80000; } to { background-color: transparent; } }
  .fade { animation-name: fade; }

  /* An overshoot: linear(0, -0.5, 1.5, 1) over 3s, held at a third and
     two thirds: a width of -50px is clamped to 0, one of 150px is not;
     an opacity of 1.5 is 1, of -0.5 is 0. */
  .o { animation-duration: 3s; animation-timing-function: linear(0, -0.5, 1.5, 1); animation-play-state: paused; }
  .t1 { animation-delay: -1s; }
  .t2 { animation-delay: -2s; }
  @keyframes over { from { width: 0px; } to { width: 100px; } }
  .over { animation-name: over; }
  @keyframes opacity { from { opacity: 0; } to { opacity: 1; } }
  .opacity { animation-name: opacity; width: 60px; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="bar a length p1"></div></div>
    <div class="cell"><div class="bar a length p2"></div></div>
    <div class="cell"><div class="bar a length p3"></div></div>
  </div>
  <div class="row">
    <div class="cell"><div class="bar a mixed p1"></div></div>
    <div class="cell"><div class="bar a mixed p2"></div></div>
    <div class="cell"><div class="bar a mixed p3"></div></div>
  </div>
  <div class="row">
    <div class="cell"><div class="bar a calc p1"></div></div>
    <div class="cell"><div class="bar a calc p2"></div></div>
    <div class="cell"><div class="bar a calc p3"></div></div>
  </div>
  <div class="row">
    <div class="cell flex"><div class="o1"></div><div class="o2"></div><div class="o3"></div><div class="g a order p1"></div></div>
    <div class="cell flex"><div class="o1"></div><div class="o2"></div><div class="o3"></div><div class="g a order p2"></div></div>
    <div class="cell flex"><div class="o1"></div><div class="o2"></div><div class="o3"></div><div class="g a order p3"></div></div>
  </div>
  <div class="row">
    <div class="cell stack"><div class="under a z p1"></div><div class="over"></div></div>
    <div class="cell stack"><div class="under a z p2"></div><div class="over"></div></div>
    <div class="cell stack"><div class="under a z p3"></div><div class="over"></div></div>
  </div>
  <div class="row">
    <div class="cell flex grow"><div></div><div class="g a growing p1"></div></div>
    <div class="cell flex grow"><div></div><div class="g a growing p2"></div></div>
    <div class="cell flex grow"><div></div><div class="g a growing p3"></div></div>
  </div>
  <div class="row">
    <div class="cell backdrop"><div class="bar a colour p1"></div></div>
    <div class="cell backdrop"><div class="bar a colour p2"></div></div>
    <div class="cell backdrop"><div class="bar a colour p3"></div></div>
  </div>
  <div class="row">
    <div class="cell backdrop"><div class="bar a appear p1"></div></div>
    <div class="cell backdrop"><div class="bar a appear p2"></div></div>
    <div class="cell backdrop"><div class="bar a appear p3"></div></div>
  </div>
  <div class="row">
    <div class="cell backdrop"><div class="bar a fade p1"></div></div>
    <div class="cell backdrop"><div class="bar a fade p2"></div></div>
    <div class="cell backdrop"><div class="bar a fade p3"></div></div>
  </div>
  <div class="row">
    <div class="cell"><div class="bar o over t1"></div></div>
    <div class="cell"><div class="bar o over t2"></div></div>
    <div class="cell"><div class="bar o opacity t1"></div></div>
    <div class="cell"><div class="bar o opacity t2"></div></div>
  </div>
</body>
</html>
