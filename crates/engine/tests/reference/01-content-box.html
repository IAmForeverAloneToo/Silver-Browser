<!doctype html>
<html>
<head>
<title>Margins, padding and borders in the content box</title>
<style>
  html { background-color: #e8ecf1; }
  .outer {
    width: 400px;
    margin: 20px;
    padding: 15px;
    border: 4px solid #1b2a41;
    background-color: #c9d6e3;
  }
  .inner {
    height: 60px;
    margin: 10px 30px;
    padding: 8px;
    border: 2px solid #3b6ea5;
    background-color: #ffffff;
  }
  .second {
    width: 100px;
    height: 40px;
    margin: 12px 0 0 50px;
    border: 6px solid #a23b72;
  }
  .after {
    width: 300px;
    height: 30px;
    margin: 25px 0 0 20px;
    background-color: #3b6ea5;
  }
</style>
</head>
<body>
  <div class="outer">
    <div class="inner"></div>
    <div class="second"></div>
  </div>
  <div class="after"></div>
</body>
</html>
