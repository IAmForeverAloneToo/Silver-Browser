<!doctype html>
<html>
<head>
<title>Generated boxes on html and body: the canvas takes the body's background, and theirs are their own</title>
<style>
  html::before { content: ""; display: block; height: 40px; background-color: #3a6b4c; }
  html::after { content: ""; display: block; height: 30px; margin: 0 100px; background-color: #8fbf9f; }
  body { margin: 20px; background-color: #e6f2ea; }
  body::before { content: ""; display: block; width: 200px; height: 50px; background-color: #5c8f6e; }
  body::after { content: ""; display: block; width: 100px; height: 70px; margin-left: auto; background-color: #26452f; }
  body div { height: 60px; margin: 10px 0; background-color: #b5d6c0; }
</style>
</head>
<body>
  <div></div>
</body>
</html>
