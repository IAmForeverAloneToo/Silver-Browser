<!doctype html>
<html>
<head>
<title>Grid: the shorthands — grid in its template, auto-flow and areas forms, grid-template with areas and names, grid-area, grid-row and grid-column, place-content, place-items, place-self, gap and the legacy gap names</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .g { display: grid; margin: 8px 20px; background-color: #e6dcc8; }
  .g > div { background-color: #a07a3a; }
  .g > div:nth-child(2n) { background-color: #c8a46a; }
  .g > div:nth-child(3n) { background-color: #604a20; }
  .col { float: left; width: 400px; }
  .g { width: 360px; }
  .g > div { min-height: 16px; }
  .a { grid: auto-flow 20px / 1fr 2fr 1fr; gap: 4px 12px; }
  .b { grid: 20px 30px / auto-flow dense 50px; grid-gap: 6px; }
  .b > div:nth-child(2) { grid-column: span 2; }
  .c { grid: "head head" 20px "side main" 40px / 80px 1fr; grid-row-gap: 4px; grid-column-gap: 8px; }
  .c > div:nth-child(1) { grid-area: head; }
  .c > div:nth-child(2) { grid-area: main; }
  .c > div:nth-child(3) { grid-area: side; }
  .d { grid-template: "a a b" 24px [mid] "c d d" 36px / 60px 1fr 80px; }
  .d > div:nth-child(1) { grid-area: b; }
  .d > div:nth-child(2) { grid-area: a; }
  .d > div:nth-child(3) { grid-area: c; }
  .d > div:nth-child(4) { grid-area: d; }
  .e { grid-template: [top] 20px [mid] 30px [bottom] / [l] 1fr [m] 2fr [r]; }
  .e > div:nth-child(1) { grid-area: mid / m / bottom / r; }
  .e > div:nth-child(2) { grid-area: top / l / mid; }
  .f { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 20px; }
  .f > div:nth-child(1) { grid-area: 2 / 1 / 3 / 3; }
  .f > div:nth-child(2) { grid-row: 1 / span 2; grid-column: 3 / -1; }
  .f > div:nth-child(3) { grid-column: -2; grid-row: 3; }
  .h { height: 80px; grid-template-columns: 60px 60px; grid-template-rows: 24px 24px; place-content: end space-between; place-items: center end; }
  .h > div { width: 30px; height: 16px; }
  .h > div:nth-child(3) { place-self: start; }
  .h > div:nth-child(4) { place-self: end start; }
</style>
</head>
<body>
  <div class="col">
    <div class="g a"><div></div><div></div><div></div><div></div><div></div></div>
    <div class="g b"><div></div><div></div><div></div><div></div><div></div><div></div></div>
    <div class="g c"><div></div><div></div><div></div></div>
    <div class="g d"><div></div><div></div><div></div><div></div></div>
  </div>
  <div class="col">
    <div class="g e"><div></div><div></div></div>
    <div class="g f"><div></div><div></div><div></div><div></div></div>
    <div class="g h"><div></div><div></div><div></div><div></div></div>
  </div>
</body>
</html>
