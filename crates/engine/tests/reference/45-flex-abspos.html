<!doctype html>
<html>
<head>
<title>Flex: absolutely positioned children at their static positions, by justify-content, align-items and align-self, in every direction, with an inset, margins, room to stretch, and a containing block further out</title>
<style>
  html { background-color: #eef4f8; }
  body { margin: 0; }
  .f { display: flex; position: relative; float: left; width: 140px; height: 80px; margin: 20px 0 0 20px; padding: 10px; border: 4px solid #2a4a6a; background-color: #d0e0ec; }
  .f > div { flex: none; width: 40px; height: 30px; background-color: #6a9aca; }
  .f > .a { position: absolute; width: 30px; height: 20px; background-color: #0a1a3a; }
  .row-start { clear: left; }
  .outer { position: relative; float: left; margin: 20px 0 0 20px; padding: 6px; background-color: #a8c4dc; }
  .outer > .f { position: static; float: none; margin: 0; }
</style>
</head>
<body>
  <div class="f"><div class="a"></div></div>
  <div class="f" style="justify-content: center; align-items: center"><div></div><div class="a"></div></div>
  <div class="f" style="justify-content: flex-end; align-items: flex-end"><div class="a"></div><div></div></div>
  <div class="f" style="flex-direction: row-reverse"><div></div><div class="a"></div></div>
  <div class="f row-start" style="flex-direction: column; justify-content: center; align-items: flex-end"><div class="a"></div></div>
  <div class="f" style="flex-direction: column-reverse"><div class="a"></div><div></div></div>
  <div class="f" style="justify-content: space-between; align-items: flex-start"><div></div><div class="a" style="align-self: center"></div><div></div></div>
  <div class="f" style="justify-content: space-around; align-items: end"><div class="a"></div></div>
  <div class="f row-start" style="justify-content: center; align-items: flex-end"><div class="a" style="left: 10px"></div></div>
  <div class="f" style="justify-content: flex-end; align-items: flex-end"><div class="a" style="margin: 5px 10px"></div></div>
  <div class="f" style="align-items: center"><div class="a" style="height: auto; align-self: stretch"></div><div class="a" style="height: auto; top: 0; bottom: 0; margin-left: 50px"></div></div>
  <div class="f" style="flex-wrap: wrap; align-content: flex-end; justify-content: space-evenly"><div></div><div class="a" style="order: -1"></div><div></div></div>
  <div class="outer row-start"><div class="f" style="justify-content: center; align-items: center"><div class="a"></div></div></div>
  <div class="outer"><div class="f" style="flex-direction: column; justify-content: flex-end; padding: 0"><div class="a" style="top: 0"></div></div></div>
</body>
</html>
