<!doctype html>
<html>
<head>
<title>Grid: explicit tracks of every kind — lengths, percentages, fr, minmax() and fit-content()</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .g { display: grid; margin: 8px 20px; background-color: #e6dcc8; }
  .g > div { background-color: #a07a3a; }
  .g > div:nth-child(2n) { background-color: #c8a46a; }
  .g > div:nth-child(3n) { background-color: #604a20; }
  .col { float: left; width: 400px; }
  i { display: block; background-color: #3a5a7a; }
  .a { width: 360px; grid-template-columns: 40px 20% 1fr 3fr; grid-template-rows: 30px; }
  .b { width: 300px; grid-template-columns: minmax(50px, 100px) minmax(30px, 1fr) 70px; grid-template-rows: 30px; }
  .c { width: 300px; grid-template-columns: fit-content(80px) fit-content(200px) 1fr; }
  .d { width: 200px; height: 60px; grid-template-columns: 50% 25%; grid-template-rows: 50% 25%; }
  .e { width: 300px; grid-template-columns: min-content max-content auto; }

</style>
</head>
<body>
  <div class="col">
    <div class="g a"><div></div><div></div><div></div><div></div></div>
    <div class="g b"><div></div><div></div><div></div></div>
    <div class="g c"><div><i style="width: 40px; height: 20px"></i></div><div><i style="width: 100px; height: 20px"></i></div><div></div></div>
    <div class="g d"><div></div><div></div><div></div><div></div></div>
    <div class="g e"><div><i style="width: 30px; height: 20px"></i></div><div><i style="width: 50px; height: 20px"></i></div><div></div></div>
  </div>
</body>
</html>
