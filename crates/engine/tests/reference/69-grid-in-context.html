<!doctype html>
<html>
<head>
<title>Grid: grids among other layouts — beside a float, after clearance, between collapsing margins, as a flex item, around a flex item, a table and inline items blockified, in a table cell, and in an absolutely positioned box with both insets</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .g { display: grid; margin: 8px 20px; background-color: #e6dcc8; }
  .g > div, .g > span { background-color: #a07a3a; }
  .g > :nth-child(2n) { background-color: #c8a46a; }
  .g > :nth-child(3n) { background-color: #604a20; }
  .col { float: left; width: 400px; }
  i { display: block; background-color: #3a5a7a; }
  .box { margin: 8px 20px; background-color: #d4c4a4; }
  .fl { float: left; width: 100px; height: 50px; margin-right: 10px; background-color: #3a5a7a; }
  .three { grid-template-columns: 1fr 1fr 1fr; grid-auto-rows: 20px; }
</style>
</head>
<body>
  <div class="col">
    <div class="box"><div class="fl"></div><div class="g three" style="margin: 0"><div></div><div></div><div></div><div></div></div></div>
    <div class="box"><div class="fl"></div><div class="g three" style="margin: 0; clear: left"><div></div><div></div><div></div></div></div>
    <div class="box" style="padding: 1px 0"><div style="height: 10px; margin-bottom: 20px; background-color: #3a5a7a"></div><div class="g three" style="margin: 10px 0 16px"><div></div><div></div><div></div></div><div style="height: 10px; margin-top: 6px; background-color: #3a5a7a"></div></div>
    <div class="box" style="display: flex"><div style="width: 60px; background-color: #3a5a7a"></div><div class="g three" style="flex: 1; margin: 4px"><div></div><div></div><div></div></div><div class="g" style="margin: 4px; grid-template-columns: auto auto"><div><i style="width: 30px; height: 20px"></i></div><div><i style="width: 20px; height: 20px"></i></div></div></div>
    <div class="g" style="grid-template-columns: 1fr 120px; width: 360px"><div style="display: flex; align-items: center; justify-content: space-between; padding: 4px"><i style="width: 30px; height: 10px"></i><i style="width: 40px; height: 30px"></i><i style="width: 20px; height: 20px"></i></div><div style="display: flex; flex-direction: column; gap: 4px; padding: 4px"><i style="height: 10px"></i><i style="height: 10px"></i></div></div>
  </div>
  <div class="col">
    <div class="g" style="grid-template-columns: 100px 100px 100px; grid-auto-rows: 40px; width: 360px"><div style="display: table; border-spacing: 0"><div style="display: table-cell; width: 50px; height: 20px; background-color: #3a5a7a"></div></div><span></span><span style="display: inline-block; height: 20px"></span><div style="display: table; justify-self: stretch"><div style="display: table-cell; height: 10px; background-color: #3a5a7a"></div></div></div>
    <div class="box" style="padding: 4px; display: inline-block"><table style="border-spacing: 4px; background-color: #b0a080"><tr><td style="padding: 0"><div class="g" style="margin: 0; grid-template-columns: auto 1fr"><div><i style="width: 40px; height: 16px"></i></div><div><i style="width: 30px; height: 16px"></i></div></div></td><td style="padding: 0; width: 120px"><div class="g" style="margin: 0; grid-template-columns: repeat(3, 1fr)"><div style="height: 16px"></div><div></div><div></div></div></td></tr></table></div>
    <div class="box" style="position: relative; height: 60px"><div class="g" style="position: absolute; left: 20px; right: 60px; top: 10px; margin: 0; grid-template-columns: 1fr 1fr; grid-auto-rows: 20px"><div></div><div></div><div></div></div></div>
    <div class="box" style="width: 200px"><div class="g" style="margin: 0 auto; width: 120px; grid-template-columns: 1fr 1fr; grid-auto-rows: 20px"><div></div><div></div></div><div class="g" style="margin: 4px 0 0 auto; width: 80px; grid-template-columns: 1fr; grid-auto-rows: 20px"><div></div></div></div>
  </div>
</body>
</html>
