<!doctype html>
<html>
<head>
<title>Image markers outside and inside, a gradient's, an element replaced by content, and images among a pseudo-element's text; the text transparent so that only the images are compared</title>
<meta name="reference-load" content="file">
<style>
  /* The reference browser is given the engine's own font, whose
     metrics place the markers and the images on their lines. */
  @font-face { font-family: "Reference Sans"; src: url(../../../text/fonts/DejaVuSans.ttf); }
  html { background-color: #f6f2ea; font-family: "Reference Sans"; font-size: 16px; color: transparent; }
  body { margin: 0; }
  ul { float: left; width: 110px; margin: 10px 0 0 10px; padding: 0 0 0 40px; background-color: #e0d8c8; list-style-image: url(images/dot.png); }
  .inside { list-style-position: inside; }
  .big { font-size: 32px; }
  .gradient { list-style-image: linear-gradient(#d02020, #d02020); }
  .none { list-style: none url(images/quad.png); }
  .replaced { position: absolute; left: 10px; top: 200px; content: url(images/quad.png); }
  .stretched { position: absolute; left: 60px; top: 200px; width: 60px; image-rendering: pixelated; content: url(images/quad.png); }
  p { position: absolute; left: 150px; top: 200px; width: 100px; margin: 0; background-color: #e0d8c8; }
  p::before { content: "a" url(images/dot.png) "bb" url(images/quad.png); }
</style>
</head>
<body>
  <ul><li>xx</li><li>xx</li></ul>
  <ul class="inside"><li>xx</li><li>xx</li></ul>
  <ul class="big"><li>xx</li></ul>
  <ul class="gradient"><li>xx</li><li class="big">xx</li></ul>
  <ul class="none"><li>xx</li></ul>
  <div class="replaced">this text is replaced</div>
  <div class="stretched">this too</div>
  <p>x</p>
</body>
</html>
