<!doctype html>
<html>
<head>
<title>Flex: percentages in items, widths, heights, bases, margins and paddings against the container, heights inside stretched and flexed items, against an indefinite height</title>
<style>
  html { background-color: #f0f6ee; }
  body { margin: 0; }
  .f { display: flex; width: 400px; height: 60px; margin: 16px 20px; padding: 0 10px; background-color: #d8e8d0; }
  .f > div { flex: none; height: 40px; background-color: #4a7a3a; }
  .f > div:nth-child(2) { background-color: #8aba7a; }
  .f > div:nth-child(3) { background-color: #1a3a10; }
  .f > div > div { width: 20px; background-color: #e8f4e0; }
  .left { float: left; width: 460px; }
  .c { flex-direction: column; float: left; width: 80px; height: 200px; margin: 16px 0 0 20px; padding: 10px 0; }
  .c > div { width: 60px; }
</style>
</head>
<body>
  <div class="left">
    <div class="f"><div style="width: 25%"></div><div style="width: 50%"></div></div>
    <div class="f"><div style="width: 40px; height: 50%"></div><div style="width: 40px; height: 100%"></div><div style="width: 40px; height: 100%; max-height: 50%; min-height: 25%"></div></div>
    <div class="f"><div style="flex-basis: 10%"></div><div style="flex-basis: 30%"></div><div style="flex-basis: 60%"></div></div>
    <div class="f"><div style="width: 20%; margin-left: 5%; margin-top: 5%"></div><div style="width: 20%; padding-left: 10%"></div><div style="width: 10%; margin: 0 auto 0 2.5%"></div></div>
    <div class="f"><div style="width: 60px; height: auto"><div style="height: 50%"></div></div><div style="width: 60px; height: auto; margin: 10px 0 0 10px"><div style="height: 20%"></div></div><div style="width: 60px; height: 40px; align-self: center"><div style="height: 50%"></div></div></div>
    <div class="f" style="height: auto"><div style="width: 60px; height: 50%; min-height: 20px"><div style="height: 50%; min-height: 5px"></div></div><div style="width: 60px; height: 40px"></div></div>
    <div class="f"><div style="flex: 1 1 0%; min-width: 30%"></div><div style="flex: 2 1 0%"></div><div style="flex: 0 1 50%; min-width: 0"></div></div>
  </div>
  <div class="f c"><div style="flex-basis: 25%"></div><div style="flex-basis: 50%"></div></div>
  <div class="f c"><div style="flex: 1"><div style="height: 50%"></div></div><div style="flex: 3; width: 50%"><div style="height: 50%"></div></div></div>
  <div class="f c" style="height: auto"><div style="flex: 1 0 20%; height: 30px"></div><div style="height: 10%; min-height: 15px"></div></div>
</body>
</html>
