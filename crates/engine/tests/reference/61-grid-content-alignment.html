<!doctype html>
<html>
<head>
<title>Grid: justify-content and align-content, positional and distributed, with an item across a distributed gap, auto tracks stretched, tracks that overflow, safe and unsafe, and the fallbacks of one track</title>
<style>
  html { background-color: #f6f2ea; }
  body { margin: 0; font-size: 0; }
  .g { display: grid; margin: 8px 20px; background-color: #e6dcc8; }
  .g > div { background-color: #a07a3a; }
  .g > div:nth-child(2n) { background-color: #c8a46a; }
  .g > div:nth-child(3n) { background-color: #604a20; }
  i { display: block; background-color: #3a5a7a; }
  .cell { float: left; width: 160px; height: 110px; }
  .cell > .g { width: 120px; height: 80px; margin: 12px 20px; grid-template-columns: 24px 24px 24px; grid-template-rows: 16px 16px; gap: 6px; }
  .cell > .g > div:nth-child(4) { grid-column: span 2; }
  .cell > .s { grid-template-columns: 24px auto 24px; grid-template-rows: auto 16px; }
  .cell > .o { width: 70px; height: 30px; }
  .cell > .one { grid-template-columns: 24px; grid-template-rows: 16px; }
</style>
</head>
<body>
  <div class="cell"><div class="g"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g" style="justify-content: end; align-content: end"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g" style="justify-content: center; align-content: center"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g" style="justify-content: space-between; align-content: space-between"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g" style="justify-content: space-around; align-content: space-around"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g" style="justify-content: space-evenly; align-content: space-evenly"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g s"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g s" style="justify-content: start; align-content: end"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g o" style="justify-content: center; align-content: end"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g o" style="justify-content: safe center; align-content: safe end"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g one" style="justify-content: space-between; align-content: space-around"><div></div></div></div>
  <div class="cell"><div class="g one" style="justify-content: space-evenly; align-content: space-between"><div></div></div></div>
  <div class="cell"><div class="g" style="justify-content: right; align-content: flex-end"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g" style="justify-content: left; align-content: stretch"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell"><div class="g" style="justify-content: space-between; align-content: center; grid-template-columns: 24px 24px"><div></div><div></div><div></div><div></div><div></div></div></div>
</body>
</html>
