<!doctype html>
<html>
<head>
<title>List markers: disc, circle and square, outside and inside, at two sizes, coloured by the item and by ::marker, beside floats, and clipped by the list item; the items' text transparent so that only the shapes are compared</title>
<!-- The disc and the circle are where the reference browser draws them,
     the same pixels inside, their edges anti-aliased by another
     rasterizer: an edge pixel may differ by up to 36. -->
<meta name="reference-edge-tolerance" content="36">
<style>
  /* The reference browser is given the engine's own font, whose
     metrics place and size the shapes. */
  @font-face { font-family: "Reference Sans"; src: url(../../../text/fonts/DejaVuSans.ttf); }
  html { background-color: #f6f2ea; font-family: "Reference Sans"; font-size: 16px; }
  body { margin: 0; }
  ul { float: left; width: 110px; margin: 10px 0 0 10px; padding: 0 0 0 40px; background-color: #e0d8c8; color: transparent; }
  li { color: transparent; }
  li::marker { color: #2f4f7f; }

  .disc { list-style-type: disc; }
  .circle { list-style-type: circle; }
  .square { list-style-type: square; }
  .inside { list-style-position: inside; }
  .big { font-size: 32px; }
  .coloured li { color: #3a7a4a; }
  .coloured li::marker { color: inherit; }
  .coloured li span { color: transparent; }
  .item-coloured li::marker { color: #a0522d; }

  /* An item clipped: its outside marker is outside its box. */
  .clip li { overflow: hidden; }

  /* Beside a float, the marker goes where the line starts. */
  .floats { width: 150px; padding-left: 20px; }
  .floats i { float: left; width: 50px; height: 60px; background-color: #b8b0a0; }
</style>
</head>
<body>
  <ul class="disc"><li>xx</li><li>xx</li></ul>
  <ul class="circle"><li>xx</li><li>xx</li></ul>
  <ul class="square"><li>xx</li><li>xx</li></ul>
  <ul class="disc inside"><li>xx</li><li>xx</li></ul>
  <ul class="circle inside"><li>xx</li><li>xx</li></ul>
  <ul class="disc big"><li>xx</li><li>xx</li></ul>
  <ul class="circle big"><li>xx</li></ul>
  <ul class="square big inside"><li>xx</li><li>xx</li></ul>
  <ul class="square coloured"><li><span>xx</span></li><li><span>xx</span></li></ul>
  <ul class="disc item-coloured big"><li>xx</li></ul>
  <ul class="square clip"><li>xx</li><li>xx</li></ul>
  <ul class="disc floats"><i></i><li>xx</li><li>xx</li><li>xx</li><li>xx</li></ul>
</body>
</html>
