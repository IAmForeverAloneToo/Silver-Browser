<!doctype html>
<html>
<head>
<title>Tables: the automatic width algorithm, a given width shared out past the maximum and between the guesses, percentage columns, cells with widths, a column box with one, margin auto</title>
<style>
  html { background-color: #e9eef3; }
  body { margin: 10px; }
  table { border-spacing: 4px; margin-bottom: 12px; background-color: #9fb4c7; }
  td { padding: 0; background-color: #dbe5ee; }
  .b { height: 16px; background-color: #34506b; }
  .w20 { width: 20px; } .w40 { width: 40px; } .w60 { width: 60px; } .w90 { width: 90px; }
  .fl { float: left; height: 16px; background-color: #5b7ea1; }
  .wide { width: 600px; }
  .narrow { width: 200px; }
  .centre { margin-left: auto; margin-right: auto; }
  .fixed100 { width: 100px; }
  .p25 { width: 25%; }
  .p50 { width: 50%; }
  col.c80 { width: 80px; }
</style>
</head>
<body>
<table>
<tr><td><div class="b w40"></div></td><td><div class="fl w60"></div><div class="fl w40"></div></td><td><div class="b w20"></div></td></tr>
</table>
<table class="wide">
<tr><td><div class="b w40"></div></td><td><div class="fl w60"></div><div class="fl w40"></div></td><td><div class="b w20"></div></td></tr>
</table>
<table class="narrow">
<tr><td><div class="b w40"></div></td><td><div class="fl w60"></div><div class="fl w40"></div></td><td><div class="b w20"></div></td></tr>
</table>
<table class="wide">
<tr><td class="p25"><div class="b w20"></div></td><td class="fixed100"></td><td><div class="b w40"></div></td></tr>
</table>
<table>
<tr><td class="p50"><div class="b w60"></div></td><td><div class="b w40"></div></td></tr>
</table>
<table class="wide">
<col class="c80"><col>
<tr><td></td><td><div class="b w90"></div></td><td class="p25"></td></tr>
</table>
<table class="centre">
<tr><td><div class="b w90"></div></td><td><div class="b w60"></div></td></tr>
</table>
</body>
</html>
