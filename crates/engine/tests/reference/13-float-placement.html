<!doctype html>
<html>
<head>
<title>Float placement: left and right floats, one that does not fit and drops, one that may not go higher than an earlier one</title>
<style>
  html { background-color: #f1ecf5; }
  body { margin: 0; }
  .box { width: 400px; height: 300px; margin: 20px; background-color: #efe7f5; }
  .l1 { float: left; width: 150px; height: 80px; background-color: #5b3a7a; }
  .l2 { float: left; width: 120px; height: 120px; margin: 0 10px; background-color: #8a66a8; }
  .r1 { float: right; width: 100px; height: 60px; background-color: #3e2a52; }
  .drop { float: left; width: 200px; height: 50px; background-color: #b9a1cf; }
  .r2 { float: right; width: 80px; height: 40px; background-color: #2a1c38; }
  .l3 { float: left; width: 60px; height: 30px; margin: 10px; background-color: #d7c6e6; }
</style>
</head>
<body>
  <div class="box">
    <div class="l1"></div>
    <div class="l2"></div>
    <div class="r1"></div>
    <div class="drop"></div>
    <div class="r2"></div>
    <div class="l3"></div>
  </div>
</body>
</html>
