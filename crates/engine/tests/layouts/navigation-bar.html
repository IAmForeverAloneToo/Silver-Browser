<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Layout: navigation bars</title>
<style>
  @font-face { font-family: "Layout Test Sans"; src: url(../../../text/fonts/DejaVuSans.ttf); }
  html { background-color: #f4f5f7; color: #1f2328; }
  body { margin: 0; font-family: "Layout Test Sans"; font-size: 16px; }
  h1, h2, h3, p { margin: 0; font-weight: normal; }
  .bar { display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 16px; margin-bottom: 16px; background-color: #24292f; color: #f6f8fa; }
  .logo { font-size: 20px; margin-right: 8px; }
  .links { display: flex; gap: 16px; }
  .links a { color: #d0d7de; text-decoration: none; padding: 4px 8px; }
  .links a.current { background-color: #3d444d; }
  .search { margin-left: auto; width: 180px; padding: 6px 10px; border: 1px solid #57606a; color: #8c959f; font-size: 14px; }
  .account { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .avatar { width: 28px; height: 28px; background-color: #8250df; }
  .narrow { width: 380px; height: auto; flex-wrap: wrap; row-gap: 8px; padding: 10px 16px; }
  .tabs { display: flex; width: 640px; margin: 0 16px 16px; border-bottom: 2px solid #d0d7de; background-color: #ffffff; }
  .tabs a { flex: 1; text-align: center; padding: 12px 0; color: #57606a; text-decoration: none; font-size: 15px; }
  .tabs a.current { color: #1f2328; border-bottom: 2px solid #fd8c73; margin-bottom: -2px; }
  .crumbs { display: flex; align-items: baseline; gap: 6px; margin: 0 16px; font-size: 13px; color: #57606a; }
  .crumbs .here { font-size: 20px; color: #1f2328; }
</style>
</head>
<body data-expected-width="800" data-expected-height="289">

</html>
