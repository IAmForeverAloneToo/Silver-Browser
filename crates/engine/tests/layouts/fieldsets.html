<style>
  @font-face { font-family: "Layout Test Sans"; src: url(../../../text/fonts/DejaVuSans.ttf); }
  body { margin: 0; font-family: "Layout Test Sans"; font-size: 20px; }
  /* The fieldset's em paddings are whole sixty-fourths of a pixel at
     20px, as the reference browser's layout unit keeps them. */
  .page { width: 600px; margin: 10px; }
  .box { height: 20px; background-color: #dde3ea; }
  /* Text-sized boxes have set widths: the reference browser measures
     the font about a pixel wider. */
  legend { width: 80px; }
  .fit { width: auto; }
  .chip { display: inline-block; width: 50px; height: 10px; background-color: #8899aa; }
</style>
</head>
