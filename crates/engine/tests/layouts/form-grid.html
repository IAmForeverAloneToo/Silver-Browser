<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Layout: a form on a grid</title>
<style>
  @font-face { font-family: "Layout Test Sans"; src: url(../../../text/fonts/DejaVuSans.ttf); }
  html { background-color: #f5f6f8; color: #20242a; }
  body { margin: 0; font-family: "Layout Test Sans"; font-size: 14px; }
  h1, p { margin: 0; font-weight: normal; }
  .page { width: 560px; margin: 24px auto; padding: 20px 24px; background-color: #ffffff; border: 1px solid #d3d8de; }
  h1 { font-size: 22px; }
  .lead { margin-top: 4px; color: #626a75; }
  form { display: grid; grid-template-columns: max-content 1fr; align-items: center; gap: 12px 16px; margin-top: 16px; }
  label { color: #3b424c; }
  input, textarea { display: block; box-sizing: border-box; width: 100%; height: 32px; margin: 0; padding: 0 8px; border: 1px solid #b9c0c8; background-color: #fbfbfc; font-family: "Layout Test Sans"; font-size: 14px; }
  textarea { height: 88px; }
  .top { align-self: start; padding-top: 6px; }
  .pair { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
  .wide { grid-column: 1 / -1; }
  .note { grid-column: 2; margin-top: -6px; font-size: 12px; color: #626a75; }
  .actions { grid-column: 1 / -1; display: grid; grid-auto-flow: column; justify-content: end; gap: 8px; padding-top: 8px; border-top: 1px solid #e3e6ea; }
  .button { padding: 7px 16px; border: 1px solid #b9c0c8; background-color: #f0f2f4; }
  .button.primary { border-color: #1f6f43; background-color: #2a8a55; color: #ffffff; }
</style>
</head>
<body data-expected-width="800" data-expected-height="484">
  <div class="page" data-expected-width="610" data-expected-height="484" data-offset-x="95" data-offset-y="24">
    <h1 data-expected-width="560" data-expected-height="25" data-offset-x="120" data-offset-y="45">Delivery address</h1>
    <p class="lead" data-expected-width="560" data-expected-height="16" data-offset-x="120" data-offset-y="74">Where should we send the order?</p>
    <form data-expected-width="560" data-expected-height="381" data-offset-x="120" data-offset-y="106">
      <label for="name" data-expected-width="146" data-expected-height="16" data-offset-x="120" data-offset-y="114">Full name</label><input id="name" data-expected-width="398" data-expected-height="32" data-offset-x="282" data-offset-y="106">
      <label for="street" data-expected-width="146" data-expected-height="16" data-offset-x="120" data-offset-y="158">Street</label><input id="street" data-expected-width="398" data-expected-height="32" data-offset-x="282" data-offset-y="150">
      <label for="city" data-expected-width="146" data-expected-height="16" data-offset-x="120" data-offset-y="202">City and postcode</label><div class="pair" data-expected-width="398" data-expected-height="32" data-offset-x="282" data-offset-y="194"><input id="city" data-expected-width="270" data-expected-height="32" data-offset-x="282" data-offset-y="194"><input id="postcode" data-expected-width="120" data-expected-height="32" data-offset-x="560" data-offset-y="194"></div>
      <label for="country" data-expected-width="146" data-expected-height="16" data-offset-x="120" data-offset-y="246">Country</label><input id="country" data-expected-width="398" data-expected-height="32" data-offset-x="282" data-offset-y="238">
      <p class="note" data-expected-width="398" data-expected-height="14" data-offset-x="282" data-offset-y="276">We deliver to every country in the European Union.</p>
      <label class="top" for="notes" data-expected-width="146" data-expected-height="22" data-offset-x="120" data-offset-y="302">Notes for the courier</label><textarea id="notes" data-expected-width="398" data-expected-height="88" data-offset-x="282" data-offset-y="302"></textarea>
      <p class="wide" data-expected-width="560" data-expected-height="32" data-offset-x="120" data-offset-y="402">The courier will call if nobody answers the door, and leave the parcel with a neighbour only if you allow it here.</p>
      <div class="actions" data-expected-width="560" data-expected-height="41" data-offset-x="120" data-offset-y="446"><span class="button" data-expected-width="69" data-expected-height="32" data-offset-x="420" data-offset-y="455">Back</span><span class="button primary" data-expected-width="183" data-expected-height="32" data-offset-x="497" data-offset-y="455">Continue to payment</span></div>
    </form>
  </div>
</body>
</html>
