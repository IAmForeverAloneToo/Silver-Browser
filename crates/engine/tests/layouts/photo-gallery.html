<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Layout: a photo gallery</title>
<style>
  @font-face { font-family: "Layout Test Sans"; src: url(../../../text/fonts/DejaVuSans.ttf); }
  html { background-color: #181a1d; color: #e8e6e3; }
  body { margin: 0; font-family: "Layout Test Sans"; font-size: 13px; }
  h1, p { margin: 0; font-weight: normal; }
  h1 { padding: 16px 16px 0; font-size: 22px; }
  .intro { padding: 4px 16px 0; color: #9d9a95; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: auto; gap: 14px; padding: 16px; }
  figure { display: grid; grid-template-rows: 110px auto; margin: 0; background-color: #24272b; }
  figure .photo { background-color: #3b5f7c; }
  figure:nth-child(3n) .photo { background-color: #7c5b3b; }
  figure:nth-child(4n) .photo { background-color: #4f7c3b; }
  figcaption { padding: 6px 8px 8px; }
  figcaption span { display: block; color: #9d9a95; font-size: 11px; }
  .wide { grid-column: span 2; }
  .tall { grid-row: span 2; grid-template-rows: 1fr auto; }
</style>
</head>
<body data-expected-width="800" data-expected-height="802">
  <h1 data-expected-width="800" data-expected-height="41" data-offset-x="0" data-offset-y="0">Summer, mostly by the sea</h1>
  <p class="intro" data-expected-width="800" data-expected-height="19" data-offset-x="0" data-offset-y="41">Twelve pictures, as many columns as the window has room for.</p>
  <main class="gallery" data-expected-width="800" data-expected-height="742" data-offset-x="0" data-offset-y="60">
    <figure data-expected-width="182" data-expected-height="167" data-offset-x="16" data-offset-y="76"><div class="photo" data-expected-width="182" data-expected-height="110" data-offset-x="16" data-offset-y="76"></div><figcaption data-expected-width="182" data-expected-height="57" data-offset-x="16" data-offset-y="186">The harbour at dawn<span data-expected-width="166" data-expected-height="13" data-offset-x="24" data-offset-y="207">June 4</span></figcaption></figure>
    <figure class="wide" data-expected-width="377" data-expected-height="167" data-offset-x="212" data-offset-y="76"><div class="photo" data-expected-width="377" data-expected-height="110" data-offset-x="212" data-offset-y="76"></div><figcaption data-expected-width="377" data-expected-height="57" data-offset-x="212" data-offset-y="186">The whole bay from the lighthouse, wide enough for two columns<span data-expected-width="361" data-expected-height="13" data-offset-x="220" data-offset-y="222">June 5</span></figcaption></figure>
    <figure data-expected-width="182" data-expected-height="167" data-offset-x="603" data-offset-y="76"><div class="photo" data-expected-width="182" data-expected-height="110" data-offset-x="603" data-offset-y="76"></div><figcaption data-expected-width="182" data-expected-height="57" data-offset-x="603" data-offset-y="186">Nets<span data-expected-width="166" data-expected-height="13" data-offset-x="611" data-offset-y="207">June 5</span></figcaption></figure>
    <figure class="tall" data-expected-width="182" data-expected-height="363" data-offset-x="16" data-offset-y="257"><div class="photo" data-expected-width="182" data-expected-height="306" data-offset-x="16" data-offset-y="257"></div><figcaption data-expected-width="182" data-expected-height="57" data-offset-x="16" data-offset-y="563">The cliff path, which runs down two rows<span data-expected-width="166" data-expected-height="13" data-offset-x="24" data-offset-y="599">June 6</span></figcaption></figure>
    <figure data-expected-width="182" data-expected-height="197" data-offset-x="212" data-offset-y="257"><div class="photo" data-expected-width="182" data-expected-height="110" data-offset-x="212" data-offset-y="257"></div><figcaption data-expected-width="182" data-expected-height="87" data-offset-x="212" data-offset-y="367">A gull that would not move<span data-expected-width="166" data-expected-height="13" data-offset-x="220" data-offset-y="403">June 7</span></figcaption></figure>
    <figure data-expected-width="182" data-expected-height="197" data-offset-x="407" data-offset-y="257"><div class="photo" data-expected-width="182" data-expected-height="110" data-offset-x="407" data-offset-y="257"></div><figcaption data-expected-width="182" data-expected-height="87" data-offset-x="407" data-offset-y="367">Low tide<span data-expected-width="166" data-expected-height="13" data-offset-x="415" data-offset-y="388">June 7</span></figcaption></figure>
    <figure data-expected-width="182" data-expected-height="197" data-offset-x="603" data-offset-y="257"><div class="photo" data-expected-width="182" data-expected-height="110" data-offset-x="603" data-offset-y="257"></div><figcaption data-expected-width="182" data-expected-height="87" data-offset-x="603" data-offset-y="367">The market on Saturday morning, before the crowds came down from the town<span data-expected-width="166" data-expected-height="13" data-offset-x="611" data-offset-y="433">June 8</span></figcaption></figure>
    <figure data-expected-width="182" data-expected-height="152" data-offset-x="212" data-offset-y="468"><div class="photo" data-expected-width="182" data-expected-height="110" data-offset-x="212" data-offset-y="468"></div><figcaption data-expected-width="182" data-expected-height="42" data-offset-x="212" data-offset-y="578">Boats<span data-expected-width="166" data-expected-height="13" data-offset-x="220" data-offset-y="599">June 9</span></figcaption></figure>
    <figure class="wide" data-expected-width="377" data-expected-height="152" data-offset-x="407" data-offset-y="468"><div class="photo" data-expected-width="377" data-expected-height="110" data-offset-x="407" data-offset-y="468"></div><figcaption data-expected-width="377" data-expected-height="42" data-offset-x="407" data-offset-y="578">A storm coming in from the west<span data-expected-width="361" data-expected-height="13" data-offset-x="415" data-offset-y="599">June 10</span></figcaption></figure>
    <figure data-expected-width="182" data-expected-height="152" data-offset-x="16" data-offset-y="634"><div class="photo" data-expected-width="182" data-expected-height="110" data-offset-x="16" data-offset-y="634"></div><figcaption data-expected-width="182" data-expected-height="42" data-offset-x="16" data-offset-y="744">After the rain<span data-expected-width="166" data-expected-height="13" data-offset-x="24" data-offset-y="765">June 10</span></figcaption></figure>
    <figure data-expected-width="182" data-expected-height="152" data-offset-x="212" data-offset-y="634"><div class="photo" data-expected-width="182" data-expected-height="110" data-offset-x="212" data-offset-y="634"></div><figcaption data-expected-width="182" data-expected-height="42" data-offset-x="212" data-offset-y="744">The station<span data-expected-width="166" data-expected-height="13" data-offset-x="220" data-offset-y="765">June 11</span></figcaption></figure>
    <figure data-expected-width="182" data-expected-height="152" data-offset-x="407" data-offset-y="634"><div class="photo" data-expected-width="182" data-expected-height="110" data-offset-x="407" data-offset-y="634"></div><figcaption data-expected-width="182" data-expected-height="42" data-offset-x="407" data-offset-y="744">Home<span data-expected-width="166" data-expected-height="13" data-offset-x="415" data-offset-y="765">June 12</span></figcaption></figure>
  </main>
</body>
</html>
