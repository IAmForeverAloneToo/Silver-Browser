<!doctype html>
<html>
<head>
<title>Photo grid</title>
<!-- M23.6's acceptance page: photos in PNG, JPEG, GIF and WebP, an
     animated GIF, and gradients, in a grid several viewports tall.
     benches/images.rs scrolls it at sixty frames a second. -->
<style>
  html { background: repeating-linear-gradient(135deg, #f4efe6 0 12px, #efe8dc 12px 24px); }
  body { margin: 0; font-family: sans-serif; color: #2f3640; }
  header { height: 160px; padding: 32px 48px; box-sizing: border-box;
           background: radial-gradient(ellipse at 20% 30%, #ffd6a5, #e07a5f 60%, #3d405b); color: #fffaf0; }
  h1 { margin: 0 0 8px 0; font-size: 36px; }
  main { display: grid; grid-template-columns: repeat(4, 290px); gap: 18px; padding: 24px 48px; justify-content: center; }
  figure { margin: 0; background-color: #fffdf8; border: 1px solid #d8cfc0; }
  figure img { display: block; width: 290px; height: 193px; object-fit: cover; }
  figcaption { height: 28px; padding: 6px 10px; box-sizing: border-box; font-size: 13px;
               background: linear-gradient(to right, #fffdf8, #f1e9dc); }
  .art { width: 290px; height: 193px; }
  .a { background: linear-gradient(160deg, #264653, #2a9d8f 45%, #e9c46a); }
  .b { background: radial-gradient(circle at 70% 40%, #f4a261, #e76f51 35%, #264653); }
  .c { background: repeating-linear-gradient(45deg, #e9c46a 0 14px, #f4a261 14px 28px); }
  .d { background: repeating-radial-gradient(circle at 50% 50%, #2a9d8f 0 10px, #e9f5f2 10px 20px); }
  .spin { background-color: #f0ece2; }
  .spin img { width: 193px; margin: 0 auto; }
</style>
</head>
<body>
<header><h1>Photo grid</h1>PNG, JPEG, GIF and WebP, an animated GIF and gradients.</header>
<main>
  <figure><img src="photos/hills-1.jpg" alt="Hills"><figcaption>hills-1.jpg</figcaption></figure>
  <figure><img src="photos/valley-1.png" alt="Valley"><figcaption>valley-1.png</figcaption></figure>
  <figure><img src="photos/hills-4.webp" alt="Hills"><figcaption>hills-4.webp</figcaption></figure>
  <figure><img src="photos/bands-1.gif" alt="Bands"><figcaption>bands-1.gif</figcaption></figure>
  <figure class="spin"><img src="photos/spinner.gif" alt="A spinner"><figcaption>spinner.gif, animated</figcaption></figure>
  <figure><div class="art a"></div><figcaption>linear-gradient</figcaption></figure>
  <figure><img src="photos/hills-2.jpg" alt="Hills"><figcaption>hills-2.jpg</figcaption></figure>
  <figure><img src="photos/valley-2.png" alt="Valley"><figcaption>valley-2.png</figcaption></figure>
  <figure><img src="photos/hills-5.webp" alt="Hills"><figcaption>hills-5.webp</figcaption></figure>
  <figure><div class="art b"></div><figcaption>radial-gradient</figcaption></figure>
  <figure><img src="photos/bands-2.gif" alt="Bands"><figcaption>bands-2.gif</figcaption></figure>
  <figure><img src="photos/hills-3.jpg" alt="Hills"><figcaption>hills-3.jpg</figcaption></figure>
  <figure><img src="photos/valley-3.png" alt="Valley"><figcaption>valley-3.png</figcaption></figure>
  <figure><img src="photos/hills-6.webp" alt="Hills"><figcaption>hills-6.webp</figcaption></figure>
  <figure><div class="art c"></div><figcaption>repeating-linear-gradient</figcaption></figure>
  <figure><img src="photos/hills-1.jpg" alt="Hills"><figcaption>hills-1.jpg again</figcaption></figure>
  <figure><img src="photos/valley-1.png" alt="Valley"><figcaption>valley-1.png again</figcaption></figure>
  <figure><div class="art d"></div><figcaption>repeating-radial-gradient</figcaption></figure>
  <figure><img src="photos/hills-4.webp" alt="Hills"><figcaption>hills-4.webp again</figcaption></figure>
  <figure class="spin"><img src="photos/spinner.gif" alt="A spinner"><figcaption>spinner.gif again</figcaption></figure>
  <figure><img src="photos/hills-2.jpg" alt="Hills"><figcaption>hills-2.jpg again</figcaption></figure>
  <figure><img src="photos/bands-1.gif" alt="Bands"><figcaption>bands-1.gif again</figcaption></figure>
  <figure><img src="photos/valley-2.png" alt="Valley"><figcaption>valley-2.png again</figcaption></figure>
  <figure><img src="photos/hills-5.webp" alt="Hills"><figcaption>hills-5.webp again</figcaption></figure>
  <figure><div class="art a"></div><figcaption>linear-gradient again</figcaption></figure>
  <figure><img src="photos/hills-3.jpg" alt="Hills"><figcaption>hills-3.jpg again</figcaption></figure>
  <figure><img src="photos/valley-3.png" alt="Valley"><figcaption>valley-3.png again</figcaption></figure>
  <figure><div class="art b"></div><figcaption>radial-gradient again</figcaption></figure>
  <figure><img src="photos/hills-6.webp" alt="Hills"><figcaption>hills-6.webp again</figcaption></figure>
  <figure><img src="photos/bands-2.gif" alt="Bands"><figcaption>bands-2.gif again</figcaption></figure>
  <figure><div class="art c"></div><figcaption>repeating-linear-gradient again</figcaption></figure>
  <figure><img src="photos/hills-1.jpg" alt="Hills"><figcaption>hills-1.jpg, third</figcaption></figure>
  <figure><img src="photos/valley-1.png" alt="Valley"><figcaption>valley-1.png, third</figcaption></figure>
  <figure><img src="photos/hills-4.webp" alt="Hills"><figcaption>hills-4.webp, third</figcaption></figure>
  <figure><div class="art d"></div><figcaption>repeating-radial-gradient again</figcaption></figure>
  <figure class="spin"><img src="photos/spinner.gif" alt="A spinner"><figcaption>spinner.gif, third</figcaption></figure>
  <figure><img src="photos/hills-2.jpg" alt="Hills"><figcaption>hills-2.jpg, third</figcaption></figure>
  <figure><img src="photos/valley-2.png" alt="Valley"><figcaption>valley-2.png, third</figcaption></figure>
  <figure><img src="photos/hills-5.webp" alt="Hills"><figcaption>hills-5.webp, third</figcaption></figure>
  <figure><img src="photos/bands-1.gif" alt="Bands"><figcaption>bands-1.gif, third</figcaption></figure>
  <figure><div class="art a"></div><figcaption>linear-gradient, third</figcaption></figure>
  <figure><img src="photos/hills-3.jpg" alt="Hills"><figcaption>hills-3.jpg, third</figcaption></figure>
  <figure><img src="photos/valley-3.png" alt="Valley"><figcaption>valley-3.png, third</figcaption></figure>
  <figure><img src="photos/hills-6.webp" alt="Hills"><figcaption>hills-6.webp, third</figcaption></figure>
  <figure><div class="art b"></div><figcaption>radial-gradient, third</figcaption></figure>
  <figure><img src="photos/bands-2.gif" alt="Bands"><figcaption>bands-2.gif, third</figcaption></figure>
  <figure><img src="photos/hills-1.jpg" alt="Hills"><figcaption>hills-1.jpg, fourth</figcaption></figure>
  <figure><img src="photos/valley-1.png" alt="Valley"><figcaption>valley-1.png, fourth</figcaption></figure>
</main>
</body>
</html>
