[package]
name = "crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

# Leaf crate: Web Crypto's operations and key store (G255,
# docs/design/webcrypto.md), engine-neutral, every primitive aws-lc-rs's.
[dependencies]
aws-lc-rs.workspace = true
# Its C library, for `native`'s few calls (the lead's ruling, G255).
aws-lc-sys.workspace = true
# Its JSON, for a wrapped JWK's text (wrapKey and unwrapKey); no
# dependency of its own, fuzzed as `devtools_json`.
devtools.workspace = true

[features]
# The fuzz targets' way to `native`'s calls (`crypto::fuzzing`): off in
# every build but theirs.
fuzzing = []

[dev-dependencies]
