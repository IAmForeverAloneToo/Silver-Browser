[package]
name = "paint"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The hooks' timing (G247, dom's `hook_timing`): off, compiled out.
hook-timing = ["dom/hook-timing", "layout/hook-timing"]

[dependencies]
dom.workspace = true
images.workspace = true
layout.workspace = true
style.workspace = true

# css: only `paint_styled_document`'s tests need to build stylesheets.
# text: only `paint_fragments`'s tests need a FontStore for `layout::layout`.
[dev-dependencies]
css.workspace = true
html.workspace = true
text.workspace = true
