[package]
name = "silver-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The GPU backend (M19.3): the browser draws on it where the machine
# has an adapter, unless `--software` is given. Off, nothing of wgpu
# is built.
default = ["gpu"]
gpu = ["engine/gpu"]

[dependencies]
engine.workspace = true
ui.workspace = true
winit.workspace = true
softbuffer.workspace = true
arboard.workspace = true

# The user's preferences where the operating system says them (M20.3).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[dev-dependencies]
# The scripted server, and the bundled font, the session's tests run on.
net = { workspace = true, features = ["test-server"] }
text.workspace = true
