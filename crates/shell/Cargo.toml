[package]
name = "silver-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The GPU backend (M19.3): the browser draws on it where the machine
# has an adapter, unless `--software` is given. Off, nothing of wgpu
# is built.
default = ["gpu"]
gpu = ["engine/gpu"]
# One process (M34.6, D30, docs/design/processes.md): the session drives
# an `Engine` in the browser's own process and starts no renderer, for
# debugging and for machines short of memory. Without it, each site's
# pages are shown by a renderer process of their own.
single-process = []

[dependencies]
engine.workspace = true
# The DevTools' protocol, which the router reads (M36).
devtools.workspace = true
# The system's fonts, scanned once and aside as the browser starts (M35.6).
text.workspace = true
ui.workspace = true
winit.workspace = true
softbuffer.workspace = true
arboard.workspace = true

# A profile in memory: a private window's (M37).
profile.workspace = true

# The user's preferences where the operating system says them (M20.3).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# The audio output, WASAPI (M40).
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[dev-dependencies]
# The scripted server, and the bundled font, the session's tests run on.
net = { workspace = true, features = ["test-server"] }
