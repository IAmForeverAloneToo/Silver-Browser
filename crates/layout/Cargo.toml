[package]
name = "layout"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The hooks' timing (G247, dom's `hook_timing`): off, compiled out.
hook-timing = ["dom/hook-timing", "style/hook-timing"]

[dependencies]
dom.workspace = true
images.workspace = true
rayon.workspace = true
style.workspace = true
svg.workspace = true
text.workspace = true
unicode-properties.workspace = true

# css: only tests need to build fixture stylesheets; html: the box tree
# tests build table fixtures from real markup (M12), a downward edge
# (html sits below layout in the layer stack) and dev-only.
[dev-dependencies]
css.workspace = true
html.workspace = true
