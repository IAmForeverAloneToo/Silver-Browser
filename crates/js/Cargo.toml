[package]
name = "js"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rquickjs.workspace = true
wasmi.workspace = true
wasmi_core.workspace = true
wasmparser.workspace = true
# Intl (D63); of ICU4X's unstable parts, the compact formatter.
icu_decimal = { workspace = true, features = ["unstable"] }
icu_datetime.workspace = true
icu_collator.workspace = true
icu_plurals.workspace = true
icu_calendar.workspace = true
icu_locale.workspace = true
icu_time.workspace = true
fixed_decimal.workspace = true
icu_experimental.workspace = true
icu_provider.workspace = true
# Intl.Segmenter and Intl.DurationFormat's lists.
icu_segmenter.workspace = true
icu_list.workspace = true
writeable.workspace = true

# The calling thread's stack's bounds (G253, `stack.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The text format, for the tests' modules (M29).
wat = "1"

# `cargo fuzz` builds with `--cfg fuzzing`, which `stack.rs` reads.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
