# Fuzz targets for everything that parses text from a page: the
# Encoding Standard's decoders, the URL parser, MIME types and sniffing,
# the HTTP/1.1 response reader, the HTML parser, the CSS tokenizer and
# parser, the selector parser, the cascade, and the whole pipeline
# through to a raster; for the image decoders; and for the engine whose
# document changes in place, held to a full pass over it; and for
# scripts, which run under their limits, and the policies that say which
# may run; and for the cookie jar; and for sequences of DOM calls a page's script makes, and of
# the input a page's controls are used through; and for Web Storage over
# the profile, and the HTTP cache; and for WebAssembly modules, valid
# ones made by wasm-smith and any bytes besides; and for the 2D canvas
# context alone; and for a message's serialized form, made again in a
# realm; and for the XML parser and SVG, read, drawn, hit and asked (M32);
# and for the DevTools' JSON (M36).
# Not a workspace member: libfuzzer needs nightly, and the normal build
# must not.
# `cargo +nightly fuzz run <target>` from the repository root; CI runs
# each target for a short while on every push and for longer weekly.

[package]
name = "silver-browser-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
wasm-smith = "0.228"
canvas = { path = "../crates/canvas" }
css = { path = "../crates/css" }
devtools = { path = "../crates/devtools" }
dom = { path = "../crates/dom" }
encoding = { path = "../crates/encoding" }
# Without the GPU backend: the targets draw in software, and wgpu is
# nothing to fuzz through.
engine = { path = "../crates/engine", default-features = false }
html = { path = "../crates/html" }
images = { path = "../crates/images" }
js = { path = "../crates/js" }
layout = { path = "../crates/layout" }
net = { path = "../crates/net" }
paint = { path = "../crates/paint" }
profile = { path = "../crates/profile" }
render = { path = "../crates/render", default-features = false }
style = { path = "../crates/style" }
svg = { path = "../crates/svg" }
text = { path = "../crates/text" }

# The fuzz build checks overflow everywhere; not in tiny-skia, whose
# 16-bit lanes wrap on purpose (the workspace's dev profile says why).
# Its debug assertions stay.
[profile.release.package.tiny-skia]
debug-assertions = true
overflow-checks = false

# Nor in zune-jpeg, whose DC coefficient wraps on a corrupt stream as a
# release build's does (the workspace's dev profile says why).
[profile.release.package.zune-jpeg]
debug-assertions = true
overflow-checks = false

