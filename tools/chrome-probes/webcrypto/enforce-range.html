<!doctype html>
<meta charset="utf-8">
<pre id="out"></pre>
<script>
(async () => {
  const s = crypto.subtle;
  const out = [];
  const hkdf = await s.importKey('raw', new Uint8Array(16), 'HKDF', false, ['deriveBits', 'deriveKey']);
  const pb = await s.importKey('raw', new Uint8Array(16), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
  const hAlg = {name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(1), info: new Uint8Array(1)};
  const pAlg = {name: 'PBKDF2', hash: 'SHA-256', salt: new Uint8Array(1), iterations: 1};
  const lengths = [NaN, Infinity, -Infinity, -8, -0.5, 2 ** 32, 2 ** 32 + 8, 8.9, '16', true, {valueOf() { return 24; }}, null, undefined];
  for (const [name, key, alg] of [['HKDF', hkdf, hAlg], ['PBKDF2', pb, pAlg]]) {
    for (const len of lengths) {
      try {
        const r = await s.deriveBits(alg, key, len);
        out.push(name + ' ' + String(len) + ' -> ' + r.byteLength);
      } catch (e) {
        out.push(name + ' ' + String(len) + ' -> ' + e.name + ': ' + e.message);
      }
    }
  }
  // deriveKey's length in an AES or HMAC derived type.
  for (const len of [NaN, -8, 2 ** 32 + 8, 128.7]) {
    for (const type of [{name: 'AES-GCM', length: len}, {name: 'HMAC', hash: 'SHA-256', length: len}]) {
      try {
        const k = await s.deriveKey(hAlg, hkdf, type, true, type.name === 'HMAC' ? ['sign'] : ['encrypt']);
        out.push('deriveKey ' + type.name + ' ' + String(len) + ' -> ' + k.algorithm.length);
      } catch (e) {
        out.push('deriveKey ' + type.name + ' ' + String(len) + ' -> ' + e.name + ': ' + e.message);
      }
    }
  }
  window.__done = out;
})().catch((e) => { document.getElementById('out').textContent = 'failed ' + e; });
</script>
